<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper Radio Podcast Studio — EchoHeart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --nav-bg-twilight: rgba(18, 12, 36, 0.94);
      --nav-border-twilight: rgba(168, 139, 235, 0.35);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --text-light: #e2daf8;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #0d0b18; color: #e2daf8; }
    body.basement-mode { background: #08030f; color: #fce8ec; }
    body.backstage-mode { background: #05020a; color: #ffffff; }

    body.basement-mode .navbar {
      background: rgba(15, 8, 22, 0.96);
      border-bottom-color: rgba(255, 77, 109, 0.45);
    }

    body.backstage-mode .navbar {
      background: rgba(10, 4, 16, 0.98);
      border-bottom: 2px solid #ff007f;
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
    }

    /* Universal Navbar Base Styles */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--nav-bg-twilight);
      border-bottom: 2px solid var(--nav-border-twilight);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-sizing: border-box;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .logo-main {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-pink);
      opacity: 0.9;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-item {
      color: #cbb8f6;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(168, 139, 235, 0.18);
      color: #ffffff;
    }

    /* Mode Select Dropdown Styling */
    .mode-select-dropdown {
      background: rgba(35, 25, 65, 0.9);
      border: 1px solid #f4b8c4;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
    }

    body.basement-mode .mode-select-dropdown {
      border-color: #ff4d6d;
      background: rgba(25, 10, 30, 0.9);
    }

    body.backstage-mode .mode-select-dropdown {
      border-color: #ffd166;
      background: rgba(30, 5, 20, 0.9);
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
    }

    .mobile-menu-btn {
      display: none;
    }

    /* Mobile Collapsible Navigation */
    @media (max-width: 992px) {
      .nav-container { padding: 10px 16px; }

      .mobile-menu-btn {
        display: flex !important;
        background: rgba(168, 139, 235, 0.15);
        border: 1px solid rgba(168, 139, 235, 0.3);
        border-radius: 8px;
        padding: 8px;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
      }

      .hamburger-bar {
        width: 22px;
        height: 2.5px;
        background: #f4b8c4;
        border-radius: 2px;
      }

      .nav-links {
        display: none !important;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 10, 30, 0.98);
        border-bottom: 2px solid rgba(168, 139, 235, 0.35);
        flex-direction: column;
        padding: 16px;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      }

      .nav-links.open { display: flex !important; }
      .nav-item, .mode-selector-wrapper { width: 100%; box-sizing: border-box; }
      .mode-select-dropdown { width: 100%; text-align: center; }
    }

    /* Podcast Layout Styles */
    .podcast-container {
      max-width: 1200px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      padding: 0 20px;
    }

    @media (max-width: 900px) { .podcast-container { grid-template-columns: 1fr; } }

    .wide-stage {
      background: linear-gradient(145deg, #120924, #080412);
      border: 2px solid #f4b8c4;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 0 30px rgba(244, 184, 196, 0.25);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    body.basement-mode .wide-stage {
      border-color: #ff4d6d;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.3);
    }

    body.backstage-mode .wide-stage {
      border-color: #ffd166;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.35);
    }

    .on-air-badge {
      background: #ff3355;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    body.basement-mode .on-air-badge {
      background: linear-gradient(135deg, #ff4d6d, #a88beb);
    }

    body.backstage-mode .on-air-badge {
      background: linear-gradient(135deg, #ffd166, #ff007f);
      color: #000;
    }

    .speaker-booth-wide {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
      background: rgba(20, 14, 38, 0.6);
      padding: 16px;
      border-radius: 14px;
    }

    @media (max-width: 500px) {
      .speaker-booth-wide { grid-template-columns: repeat(2, 1fr); }
    }

    .speaker-avatar {
      text-align: center;
      opacity: 0.45;
      transition: all 0.3s ease;
    }

    .speaker-avatar.speaking {
      opacity: 1;
      transform: scale(1.08);
    }

    .speaker-icon-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(30, 22, 54, 0.9);
      border: 2px solid rgba(168, 139, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 6px;
      transition: all 0.3s ease;
    }

    .speaker-avatar.speaking .speaker-icon-box {
      border-color: #f4b8c4;
      box-shadow: 0 0 18px rgba(244, 184, 196, 0.8);
    }

    body.basement-mode .speaker-avatar.speaking .speaker-icon-box {
      border-color: #ff4d6d;
      box-shadow: 0 0 18px rgba(255, 77, 109, 0.8);
    }

    body.backstage-mode .speaker-avatar.speaking .speaker-icon-box {
      border-color: #ffd166;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.8);
    }

    .script-transcript-box {
      background: rgba(15, 10, 30, 0.9);
      border-left: 5px solid #a88beb;
      padding: 20px;
      border-radius: 0 14px 14px 0;
      min-height: 100px;
      margin-bottom: 20px;
    }

    body.basement-mode .script-transcript-box { border-left-color: #ff4d6d; }
    body.backstage-mode .script-transcript-box { border-left-color: #ffd166; }

    .current-speaker-title { color: #f4b8c4; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 6px; }
    body.basement-mode .current-speaker-title { color: #ff4d6d; }
    body.backstage-mode .current-speaker-title { color: #ffd166; }

    .current-dialogue-line { font-size: 1.05rem; font-style: italic; line-height: 1.5; }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(168, 139, 235, 0.2);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a88beb, #f4b8c4); transition: width 0.3s ease; }
    body.basement-mode .progress-bar-fill { background: linear-gradient(90deg, #ff4d6d, #a88beb); }
    body.backstage-mode .progress-bar-fill { background: linear-gradient(90deg, #ffd166, #ff007f); }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none;
      border-radius: 12px;
      color: #0d0b18;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
    }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }

    .archive-drawer {
      background: rgba(22, 15, 42, 0.9);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 18px;
      padding: 20px;
    }

    body.basement-mode .archive-drawer { border-color: rgba(255, 77, 109, 0.4); }
    body.backstage-mode .archive-drawer { border-color: rgba(255, 209, 102, 0.4); }

    .ep-card {
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(168, 139, 235, 0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ep-card:hover, .ep-card.active { border-color: #f4b8c4; background: rgba(35, 25, 65, 0.9); }
    body.basement-mode .ep-card:hover, body.basement-mode .ep-card.active { border-color: #ff4d6d; background: rgba(40, 12, 35, 0.9); }
    body.backstage-mode .ep-card:hover, body.backstage-mode .ep-card.active { border-color: #ffd166; background: rgba(30, 10, 40, 0.9); }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 2, 12, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: rgba(22, 15, 42, 0.96);
      border: 2px solid #a88beb;
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .vip-modal-card { border-color: #ff007f; box-shadow: 0 0 30px rgba(255, 0, 127, 0.4); }
    .modal-card h3 { margin: 0 0 10px; color: #ffffff; font-size: 1.3rem; }
    .modal-card p { color: #cbb8f6; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .modal-price-tag {
      background: rgba(255, 209, 102, 0.15);
      border: 1px solid #ffd166;
      color: #ffd166;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: inline-block;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
    .google-btn { background: #ffffff; color: #111; }
    .stripe-btn { background: linear-gradient(135deg, #ff007f, #ffd166); color: #000; }
    .close-btn { background: transparent; color: #a88beb; border: 1px solid rgba(168, 139, 235, 0.3); }
  </style>
</head>
<body class="twilight-mode">

  <!-- Universal Header Navigation -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- Brand Logo -->
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <span class="logo-main">🌸 OTAKU NEKO LOUNGE</span>
          <span class="logo-sub">✦ ECHOHEART UNIVERSE</span>
        </a>
      </div>

      <!-- Hamburger Toggle Button -->
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation Menu" onclick="toggleMobileMenu()">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>

      <!-- Navigation Links & 3-Tier Mode Selector -->
      <nav class="nav-links" id="nav-menu">
        <a href="index.html" class="nav-item">🏠 Home</a>
        <a href="podcast.html" class="nav-item active">🎙️ Podcast</a>
        <a href="neko-fm.html" class="nav-item">📻 24/7 Neko FM</a>
        <a href="chat.html" class="nav-item">💬 Live Chat</a>
        <a href="hub.html" class="nav-item">🌌 Universe Hub</a>

        <div class="mode-selector-wrapper">
          <select id="mode-selector" class="mode-select-dropdown" onchange="handleModeChange(this.value)">
            <option value="twilight">🌸 Twilight (Public)</option>
            <option value="basement">⚡ Basement 🔒</option>
            <option value="backstage">🎟️ Backstage Pass 💎</option>
          </select>
        </div>
      </nav>

    </div>
  </header>

  <!-- Podcast Stage & Archive Layout -->
  <main class="podcast-container">
    <!-- LEFT: LIVE PODCAST STAGE -->
    <section class="wide-stage">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
        <h2 id="stage-main-title">🎙️ WHISPER RADIO STUDIO STAGE</h2>
        <span id="stage-air-badge" class="on-air-badge">ON AIR</span>
      </div>

      <!-- 4 Speaker Character Avatars -->
      <div class="speaker-booth-wide">
        <div id="spk-nekomi" class="speaker-avatar">
          <div class="speaker-icon-box">🎸</div>
          <strong>Nekomi</strong>
        </div>
        <div id="spk-sera" class="speaker-avatar">
          <div class="speaker-icon-box">🎹</div>
          <strong>Sera</strong>
        </div>
        <div id="spk-akari" class="speaker-avatar">
          <div class="speaker-icon-box">🥁</div>
          <strong>Akari Minase</strong>
        </div>
        <div id="spk-aoi" class="speaker-avatar">
          <div class="speaker-icon-box">🎸</div>
          <strong>Aoi</strong>
        </div>
      </div>

      <!-- Live Line Dialogue Display -->
      <div class="script-transcript-box">
        <div id="speaker-title-display" class="current-speaker-title">🎙️ READY TO BROADCAST</div>
        <div id="dialogue-line-display" class="current-dialogue-line">"Select an episode from the archive drawer and tap start to listen!"</div>
      </div>

      <div class="progress-bar-container">
        <div id="ep-progress-fill" class="progress-bar-fill"></div>
      </div>

      <button id="podcast-play-btn" class="action-btn" onclick="togglePodcastPlayback()">▶ Start Episode Broadcast</button>
    </section>

    <!-- RIGHT: EPISODE ARCHIVE DRAWER -->
    <aside class="archive-drawer">
      <h3 id="archive-drawer-heading">📻 Episode Archives</h3>
      <div id="archive-episode-list">
        <!-- Rendered via JavaScript per active tier -->
      </div>
    </aside>
  </main>

  <script>
    // User Auth & Tier State
    let userState = {
      isLoggedIn: localStorage.getItem('neko_logged_in') === 'true',
      isVIP: localStorage.getItem('neko_is_vip') === 'true'
    };

    // Master Episode Repository organized into 3 Episodes per Mode Tier
    const EPISODES_BY_MODE = {
      twilight: [
        {

          runtime: "5:12",
          tag: "Free",
          script: [
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.3, text: "Good afternoon, Sakuraoka High! You are tuned into Whisper Radio!" },
            { speaker: "sera", title: "Sera (Keytar)", pitch: 1.1, text: "Hello everyone. Sera here on keytar synthesis." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.5, text: "And Akari Minase! Let's bring the 180 BPM energy to Prep Room B!" },

        {

          runtime: "4:48",
          tag: "Free",
          script: [
            { speaker: "sera", title: "Sera (Keytar)", pitch: 1.1, text: "Akari, your tempo shift in section three was incredible during rehearsal!" },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.5, text: "Thanks Sera! When we hit 180 BPM, the cavern reverb echoes perfectly!" },
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.3, text: "That is the EchoHeart resonance at work!" }
          ]
        },
        {
          title: "Episode 3: Sakuraoka Dusk Echoes",
          runtime: "5:35",
          tag: "Free",
          script: [
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.3, text: "Dusk is falling over Sakuraoka High..." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.5, text: "Guitar tuned, amplifier set to maximum overdrive!" },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", pitch: 0.9, text: "Let's lock in the rhythm for tonight's broadcast." }
          ]
        }
      ],
      basement: [
        {
          title: "After Dark Ep 1: Subterranean Cavern Echoes",
          runtime: "6:05",
          tag: "⚡ AFTER DARK",
          script: [
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.2, text: "Welcome to the After Dark basement session..." },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", pitch: 0.8, text: "Listen closely to the underground cavern echoes beneath Prep Room B." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.4, text: "The heavy distortion pedals sound so raw down here past school hours!" }
          ]
        },
        {
          title: "After Dark Ep 2: Late Night Riffs & Distortion",
          runtime: "6:42",
          tag: "⚡ AFTER DARK",
          script: [
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.4, text: "After Dark Episode 2! Testing our heaviest J-Rock riff sequence tonight." },
            { speaker: "sera", title: "Sera (Keytar)", pitch: 1.0, text: "Pitch bend calibration locked in for the late-night synth solos." },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", pitch: 0.8, text: "180 BPM fast tempo locked and loaded." }
          ]
        },
        {
          title: "After Dark Ep 3: Uncensored Locker Whispers",
          runtime: "7:15",
          tag: "⚡ AFTER DARK",
          script: [
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.2, text: "Late night in Locker 102... all the secrets come out after dark." },
            { speaker: "sera", title: "Sera (Keytar)", pitch: 1.0, text: "The subterranean resonance is strongest near midnight." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.4, text: "Let's play one last unreleased jam before turning off the studio lights!" }
          ]
        }
      ],
      backstage: [
        {
          title: "Backstage Pass Ep 1: Master Stem Isolation",
          runtime: "8:10",
          tag: "🎟️ VIP Pass",
          script: [
            { speaker: "sera", title: "Sera (Keytar)", pitch: 1.1, text: "Welcome VIP Backstage Pass members! Today we are isolating the master keytar stems." },
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.3, text: "You get full uncompressed studio audio and binaural room acoustic feeds." }
          ]
        },
        {
          title: "Backstage Pass Ep 2: 180 BPM Uncut Desk Feed",
          runtime: "7:50",
          tag: "🎟️ VIP Pass",
          script: [
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.5, text: "Direct soundboard feed live from Prep Room B!" },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", pitch: 0.9, text: "Zero compression, zero noise filters. Pure EchoHeart master audio." }
          ]
        },
        {
          title: "Backstage Pass Ep 3: Cavern Acoustics & Reverb",
          runtime: "9:25",
          tag: "🎟️ VIP Pass",
          script: [
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", pitch: 1.5, text: "Akari here! Unlocking full 3D spatial acoustic reverb for our VIP supporters." },
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", pitch: 1.3, text: "Thank you for supporting EchoHeart and Neko FM Backstage Pass!" }
          ]
        }
      ]
    };

    let currentEpisodeIdx = 0;
    let currentLineIdx = 0;
    let isPlaying = false;
    let playbackTimer = null;

    function handleModeChange(targetMode) {
      const selector = document.getElementById('mode-selector');

      if (targetMode === 'basement' && !userState.isLoggedIn) {
        if (selector) selector.value = getCurrentMode();
        showAuthModal('Google Login Required', 'Sign in with Google to access After-Hours Basement Podcast episodes and community profiles.');
        return;
      }

      if (targetMode === 'backstage' && !userState.isVIP) {
        if (selector) selector.value = getCurrentMode();
        showVIPModal('Backstage Pass Required', 'Unlock VIP uncompressed studio stem downloads, binaural acoustic sessions, and live chat posting.');
        return;
      }

      localStorage.setItem('neko_active_mode', targetMode);
      applyThemeMode(targetMode);
      loadTierEpisodes(targetMode);
    }

    function getCurrentMode() {
      return localStorage.getItem('neko_active_mode') || 'twilight';
    }

    function applyThemeMode(mode) {
      const body = document.body;
      const selector = document.getElementById('mode-selector');

      body.classList.remove('twilight-mode', 'basement-mode', 'backstage-mode');
      body.classList.add(`${mode}-mode`);

      if (selector) selector.value = mode;

      // Update Header Titles and Badges dynamically
      const stageTitle = document.getElementById('stage-main-title');
      const airBadge = document.getElementById('stage-air-badge');
      const drawerHeading = document.getElementById('archive-drawer-heading');

      if (mode === 'basement') {
        if (stageTitle) stageTitle.innerText = '⚡ AFTER DARK SESSIONS — BASEMENT STAGE';
        if (airBadge) airBadge.innerText = '⚡ AFTER DARK ON AIR';
        if (drawerHeading) drawerHeading.innerText = '⚡ AFTER DARK ARCHIVES';
      } else if (mode === 'backstage') {
        if (stageTitle) stageTitle.innerText = '🎟️ VIP BACKSTAGE STUDIO STAGE';
        if (airBadge) airBadge.innerText = '🎟️ VIP LIVE';
        if (drawerHeading) drawerHeading.innerText = '🎟️ VIP STEM ARCHIVES';
      } else {
        if (stageTitle) stageTitle.innerText = '🎙️ WHISPER RADIO STUDIO STAGE';
        if (airBadge) airBadge.innerText = 'ON AIR';
        if (drawerHeading) drawerHeading.innerText = '📻 Episode Archives';
      }
    }

    function loadTierEpisodes(mode) {
      stopPlayback();
      const container = document.getElementById('archive-episode-list');
      if (!container) return;

      container.innerHTML = '';
      const episodes = EPISODES_BY_MODE[mode] || EPISODES_BY_MODE.twilight;

      episodes.forEach((ep, index) => {
        const tagColor = mode === 'basement' ? '#ff4d6d' : (mode === 'backstage' ? '#ffd166' : '#a88beb');
        
        const card = document.createElement('div');
        card.id = `ep-${index}`;
        card.className = `ep-card ${index === 0 ? 'active' : ''}`;
        card.onclick = () => selectEpisode(index);
        card.innerHTML = `
          <strong>${ep.title}</strong>
          <p style="font-size: 0.8rem; margin: 4px 0 0; color: ${tagColor};">Runtime: ${ep.runtime} • ${ep.tag}</p>
        `;
        container.appendChild(card);
      });

      selectEpisode(0);
    }

    function selectEpisode(index) {
      stopPlayback();
      currentEpisodeIdx = index;
      currentLineIdx = 0;

      const currentMode = getCurrentMode();
      const episodes = EPISODES_BY_MODE[currentMode] || EPISODES_BY_MODE.twilight;

      document.querySelectorAll('.ep-card').forEach((card, idx) => {
        if (idx === index) card.classList.add('active');
        else card.classList.remove('active');
      });

      const ep = episodes[currentEpisodeIdx];
      if (ep) {
        document.getElementById('speaker-title-display').innerText = `🎙️ ${ep.title.toUpperCase()}`;
        document.getElementById('dialogue-line-display').innerText = `"Press broadcast to start listening!"`;
        document.getElementById('ep-progress-fill').style.width = '0%';
      }
    }

    function togglePodcastPlayback() {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      isPlaying = true;
      document.getElementById('podcast-play-btn').innerText = '⏸ Pause Broadcast';
      playNextLine();
    }

    function stopPlayback() {
      isPlaying = false;
      if (playbackTimer) clearTimeout(playbackTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      document.getElementById('podcast-play-btn').innerText = '▶ Start Episode Broadcast';
      document.querySelectorAll('.speaker-avatar').forEach(avatar => avatar.classList.remove('speaking'));
    }

    function playNextLine() {
      if (!isPlaying) return;

      const currentMode = getCurrentMode();
      const episodes = EPISODES_BY_MODE[currentMode] || EPISODES_BY_MODE.twilight;
      const ep = episodes[currentEpisodeIdx];

      if (!ep || currentLineIdx >= ep.script.length) {
        currentLineIdx = 0;
        stopPlayback();
        document.getElementById('dialogue-line-display').innerText = `"Episode broadcast complete! Select another episode to play."`;
        return;
      }

      const line = ep.script[currentLineIdx];

      document.querySelectorAll('.speaker-avatar').forEach(avatar => avatar.classList.remove('speaking'));
      const activeAvatar = document.getElementById(`spk-${line.speaker}`);
      if (activeAvatar) activeAvatar.classList.add('speaking');

      document.getElementById('speaker-title-display').innerText = `🎙️ ${line.title}`;
      document.getElementById('dialogue-line-display').innerText = `"${line.text}"`;

      const progressPercent = ((currentLineIdx + 1) / ep.script.length) * 100;
      document.getElementById('ep-progress-fill').style.width = `${progressPercent}%`;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(line.text);
        utterance.pitch = line.pitch || 1.0;
        utterance.rate = 1.0;

        utterance.onend = function() {
          currentLineIdx++;
          if (isPlaying) playbackTimer = setTimeout(playNextLine, 600);
        };

        utterance.onerror = function() {
          currentLineIdx++;
          if (isPlaying) playbackTimer = setTimeout(playNextLine, 2500);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        currentLineIdx++;
        playbackTimer = setTimeout(playNextLine, 3500);
      }
    }

    function showAuthModal(title, message) {
      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card">
            <h3>🔑 ${title}</h3>
            <p>${message}</p>
            <div class="modal-actions">
              <button class="modal-btn google-btn" onclick="simulateGoogleLogin()">Sign In with Google</button>
              <button class="modal-btn close-btn" onclick="removeExistingModals()">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function showVIPModal(title, message) {
      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card vip-modal-card">
            <h3>🎟️ ${title}</h3>
            <p>${message}</p>
            <div class="modal-price-tag">$4.99 / month • Backstage Pass</div>
            <div class="modal-actions">
              <button class="modal-btn stripe-btn" onclick="simulateStripeCheckout()">Unlock Backstage Pass</button>
              <button class="modal-btn close-btn" onclick="removeExistingModals()">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function removeExistingModals() {
      const existing = document.getElementById('neko-gate-modal');
      if (existing) existing.remove();
    }

    function simulateGoogleLogin() {
      userState.isLoggedIn = true;
      localStorage.setItem('neko_logged_in', 'true');
      removeExistingModals();
      handleModeChange('basement');
    }

    function simulateStripeCheckout() {
      userState.isLoggedIn = true;
      userState.isVIP = true;
      localStorage.setItem('neko_logged_in', 'true');
      localStorage.setItem('neko_is_vip', 'true');
      removeExistingModals();
      handleModeChange('backstage');
    }

    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const mode = getCurrentMode();
      applyThemeMode(mode);
      loadTierEpisodes(mode);

      document.addEventListener('click', function(event) {
        const navMenu = document.getElementById('nav-menu');
        const isInsideNavbar = event.target.closest('.navbar');
        if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
        }
      });
    });
  </script>
</body>
</html>
