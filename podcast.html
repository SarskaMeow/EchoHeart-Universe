<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper Radio Podcast Studio — EchoHeart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --nav-bg-twilight: rgba(18, 12, 36, 0.94);
      --nav-border-twilight: rgba(168, 139, 235, 0.35);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --text-light: #e2daf8;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #0d0b18; color: #e2daf8; }
    body.basement-mode { background: #08030f; color: #fce8ec; }
    body.backstage-mode { background: #05020a; color: #ffffff; }

    body.basement-mode .navbar {
      background: rgba(15, 8, 22, 0.96);
      border-bottom-color: rgba(255, 77, 109, 0.45);
    }

    body.backstage-mode .navbar {
      background: rgba(10, 4, 16, 0.98);
      border-bottom: 2px solid #ff007f;
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
    }

    /* Universal Navbar Base Styles */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--nav-bg-twilight);
      border-bottom: 2px solid var(--nav-border-twilight);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-sizing: border-box;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .logo-main {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-pink);
      opacity: 0.9;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-item {
      color: #cbb8f6;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(168, 139, 235, 0.18);
      color: #ffffff;
    }

    /* Mode Select Dropdown Styling */
    .mode-select-dropdown {
      background: rgba(35, 25, 65, 0.9);
      border: 1px solid #f4b8c4;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
    }

    body.basement-mode .mode-select-dropdown {
      border-color: #ff4d6d;
      background: rgba(25, 10, 30, 0.9);
    }

    body.backstage-mode .mode-select-dropdown {
      border-color: #ffd166;
      background: rgba(30, 5, 20, 0.9);
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
    }

    .mobile-menu-btn {
      display: none;
    }

    /* Mobile Collapsible Navigation */
    @media (max-width: 992px) {
      .nav-container { padding: 10px 16px; }

      .mobile-menu-btn {
        display: flex !important;
        background: rgba(168, 139, 235, 0.15);
        border: 1px solid rgba(168, 139, 235, 0.3);
        border-radius: 8px;
        padding: 8px;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
      }

      .hamburger-bar {
        width: 22px;
        height: 2.5px;
        background: #f4b8c4;
        border-radius: 2px;
      }

      .nav-links {
        display: none !important;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 10, 30, 0.98);
        border-bottom: 2px solid rgba(168, 139, 235, 0.35);
        flex-direction: column;
        padding: 16px;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      }

      .nav-links.open { display: flex !important; }
      .nav-item, .mode-selector-wrapper { width: 100%; box-sizing: border-box; }
      .mode-select-dropdown { width: 100%; text-align: center; }
    }

    /* Podcast Layout Styles */
    .podcast-container {
      max-width: 1200px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      padding: 0 20px;
    }

    @media (max-width: 900px) { .podcast-container { grid-template-columns: 1fr; } }

    .wide-stage {
      background: linear-gradient(145deg, #120924, #080412);
      border: 2px solid #f4b8c4;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 0 30px rgba(244, 184, 196, 0.25);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    body.basement-mode .wide-stage {
      border-color: #ff4d6d;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.3);
    }

    body.backstage-mode .wide-stage {
      border-color: #ffd166;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.35);
    }

    .on-air-badge {
      background: #ff3355;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    body.basement-mode .on-air-badge {
      background: linear-gradient(135deg, #ff4d6d, #a88beb);
    }

    body.backstage-mode .on-air-badge {
      background: linear-gradient(135deg, #ffd166, #ff007f);
      color: #000;
    }

    .speaker-booth-wide {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
      background: rgba(20, 14, 38, 0.6);
      padding: 16px;
      border-radius: 14px;
    }

    @media (max-width: 500px) {
      .speaker-booth-wide { grid-template-columns: repeat(2, 1fr); }
    }

    .speaker-avatar {
      text-align: center;
      opacity: 0.45;
      transition: all 0.3s ease;
    }

    .speaker-avatar.speaking {
      opacity: 1;
      transform: scale(1.08);
    }

    .speaker-icon-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(30, 22, 54, 0.9);
      border: 2px solid rgba(168, 139, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 6px;
      transition: all 0.3s ease;
    }

    .speaker-avatar.speaking .speaker-icon-box {
      border-color: #f4b8c4;
      box-shadow: 0 0 18px rgba(244, 184, 196, 0.8);
    }

    body.basement-mode .speaker-avatar.speaking .speaker-icon-box {
      border-color: #ff4d6d;
      box-shadow: 0 0 18px rgba(255, 77, 109, 0.8);
    }

    body.backstage-mode .speaker-avatar.speaking .speaker-icon-box {
      border-color: #ffd166;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.8);
    }

    .script-transcript-box {
      background: rgba(15, 10, 30, 0.9);
      border-left: 5px solid #a88beb;
      padding: 20px;
      border-radius: 0 14px 14px 0;
      min-height: 100px;
      margin-bottom: 20px;
    }

    body.basement-mode .script-transcript-box { border-left-color: #ff4d6d; }
    body.backstage-mode .script-transcript-box { border-left-color: #ffd166; }

    .current-speaker-title { color: #f4b8c4; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 6px; }
    body.basement-mode .current-speaker-title { color: #ff4d6d; }
    body.backstage-mode .current-speaker-title { color: #ffd166; }

    .current-dialogue-line { font-size: 1.05rem; font-style: italic; line-height: 1.5; }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(168, 139, 235, 0.2);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a88beb, #f4b8c4); transition: width 0.3s ease; }
    body.basement-mode .progress-bar-fill { background: linear-gradient(90deg, #ff4d6d, #a88beb); }
    body.backstage-mode .progress-bar-fill { background: linear-gradient(90deg, #ffd166, #ff007f); }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none;
      border-radius: 12px;
      color: #0d0b18;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
    }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }

    .archive-drawer {
      background: rgba(22, 15, 42, 0.9);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 18px;
      padding: 20px;
    }

    body.basement-mode .archive-drawer { border-color: rgba(255, 77, 109, 0.4); }
    body.backstage-mode .archive-drawer { border-color: rgba(255, 209, 102, 0.4); }

    .ep-card {
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(168, 139, 235, 0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ep-card:hover, .ep-card.active { border-color: #f4b8c4; background: rgba(35, 25, 65, 0.9); }
    body.basement-mode .ep-card:hover, body.basement-mode .ep-card.active { border-color: #ff4d6d; background: rgba(40, 12, 35, 0.9); }
    body.backstage-mode .ep-card:hover, body.backstage-mode .ep-card.active { border-color: #ffd166; background: rgba(30, 10, 40, 0.9); }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 2, 12, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: rgba(22, 15, 42, 0.96);
      border: 2px solid #a88beb;
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .vip-modal-card { border-color: #ff007f; box-shadow: 0 0 30px rgba(255, 0, 127, 0.4); }
    .modal-card h3 { margin: 0 0 10px; color: #ffffff; font-size: 1.3rem; }
    .modal-card p { color: #cbb8f6; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .modal-price-tag {
      background: rgba(255, 209, 102, 0.15);
      border: 1px solid #ffd166;
      color: #ffd166;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: inline-block;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
    .google-btn { background: #ffffff; color: #111; }
    .stripe-btn { background: linear-gradient(135deg, #ff007f, #ffd166); color: #000; }
    .close-btn { background: transparent; color: #a88beb; border: 1px solid rgba(168, 139, 235, 0.3); }
  </style>
</head>

  <script>
    // User Auth & Tier State
    let userState = {
      isLoggedIn: localStorage.getItem('neko_logged_in') === 'true',
      isVIP: localStorage.getItem('neko_is_vip') === 'true'
    };

    // Distinct Voice Configurations for the 4 Girls (All Female Voice Profiles)
    // Nekomi: Bright, Lead Vocalist Tone
    // Sera: Calm, Composed Keytarist Tone
    // Akari Minase: High-Pitched, Energetic Guitarist Tone
    // Aoi: Grounded, Mature Student Council President Tone
    const GIRL_VOICE_CONFIGS = {
      nekomi: { pitch: 1.25, rate: 1.0,  voiceIndex: 0 },
      sera:   { pitch: 1.08, rate: 0.95, voiceIndex: 1 },
      akari:  { pitch: 1.42, rate: 1.05, voiceIndex: 2 },
      aoi:    { pitch: 0.95, rate: 0.92, voiceIndex: 3 }
    };

    // Helper to get distinct female synthesis voice
    function getFemaleVoice(speakerKey) {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const femaleVoices = voices.filter(v => 
        v.lang.startsWith('en') && 
        (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Jenny') || 
         v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Karen') || 
         v.name.includes('Fiona') || v.name.includes('Moira') || v.name.includes('Google US English') ||
         v.name.includes('Natural'))
      );

      const cfg = GIRL_VOICE_CONFIGS[speakerKey] || GIRL_VOICE_CONFIGS.nekomi;
      
      if (femaleVoices.length > 0) {
        return femaleVoices[cfg.voiceIndex % femaleVoices.length];
      }

      const enVoices = voices.filter(v => v.lang.startsWith('en'));
      return enVoices[cfg.voiceIndex % enVoices.length] || voices[0];
    }

    // Master Episode Repository — Full Extended Scripts with Greetings, In-depth Topic Discussions, and Goodbyes

            { speaker: "sera", title: "Sera (Keytar)", text: "Hello everyone. I'm Sera, keytarist and sound arranger. It's wonderful to be here in Prep Room B today." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Yaho~! Akari Minase here! Lead guitar overdrive ready to turn up the volume!" },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", text: "And I'm Aoi, handling bass, drums, and keeping our student council schedule on track. Welcome to our daily school life broadcast!" },
            
            // --- MAIN TOPIC: NORMAL EVERYDAY SCHOOL LIFE ---
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "So, girls! How has everyone's week at Sakuraoka High been going so far?" },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Super busy! Between math class and practicing our 180 BPM guitar solos, my fingers are constantly working!" },
            { speaker: "sera", title: "Sera (Keytar)", text: "I noticed you were practicing during lunch break, Akari. The acoustic resonance in the third-floor stairwell was surprisingly crisp." },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", text: "Speaking of lunch break, the bakery near the school gates had those limited melon pan pastries today. Nekomi managed to snag the last two!" },
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "Hehe, you know it! Food energy is crucial before a full band rehearsal in Prep Room B!" },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Hey Sera, did you finish tuning the keytar pitch bend for our new track?" },
            { speaker: "sera", title: "Sera (Keytar)", text: "Yes, I spent yesterday afternoon organizing our MIDI patches. The synth lead blends smoothly with your distortion riffs now." },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", text: "As Student Council President, I also double-checked our equipment permit for Prep Room B. We're cleared for after-school practice all semester!" },
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "That's awesome news, Aoi! Nothing beats having our own studio space to hang out, drink tea, and write music." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "And don't forget study sessions! Midterms are next week, so we need to balance guitar riffs with textbook review!" },

            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "That wraps up our daily school life chat for today! Thanks for tuning in, everyone! This is Nekomi signing off!" },
            { speaker: "sera", title: "Sera (Keytar)", text: "Thank you for listening. Keep practicing hard, and this is Sera, until next time." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Bye-bye everyone! Keep rocking and stay high energy! Akari Minase out!" },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", text: "Take care on your way home from school! This is Aoi saying goodbye until our next Whisper Radio broadcast!" }
          ]
        },
        {
          title: "Episode 2: After-School Sweets & Rehearsal Routines",
          runtime: "15:00",
          tag: "Free",
          script: [
            // --- GREETINGS & INTRODUCTIONS ---
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "Hey there, Whisper Radio listeners! Nekomi here on vocals!" },
            { speaker: "sera", title: "Sera (Keytar)", text: "Greetings, everyone. Sera on keytar duty." },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Akari Minase in the house! Guitar tuned and ready!" },
            { speaker: "aoi", title: "Aoi (Bass & Drums)", text: "And Aoi on bass and drums! Welcome to Episode Two of our afternoon broadcast!" },

            // --- MAIN TOPIC: AFTER-SCHOOL SWEETS & REHEARSALS ---
            { speaker: "nekomi", title: "Nekomi (Guitar & Vocals)", text: "Today we're talking about our favorite post-rehearsal hangout spots and after-school sweets!" },
            { speaker: "akari", title: "Akari Minase (Lead Guitar)", text: "Oh! The new boba tea shop down near the station has a strawberry boba parfait that is to die for!" },

    let currentEpisodeIdx = 0;
    let currentLineIdx = 0;
    let isPlaying = false;
    let playbackTimer = null;

    function handleModeChange(targetMode) {
      const selector = document.getElementById('mode-selector');

      if (targetMode === 'basement' && !userState.isLoggedIn) {
        if (selector) selector.value = getCurrentMode();
        showAuthModal('Google Login Required', 'Sign in with Google to access After-Hours Basement Podcast episodes and community profiles.');
        return;
      }

      if (targetMode === 'backstage' && !userState.isVIP) {
        if (selector) selector.value = getCurrentMode();
        showVIPModal('Backstage Pass Required', 'Unlock VIP uncompressed studio stem downloads, binaural acoustic sessions, and live chat posting.');
        return;
      }

      localStorage.setItem('neko_active_mode', targetMode);
      applyThemeMode(targetMode);
      loadTierEpisodes(targetMode);
    }

    function getCurrentMode() {
      return localStorage.getItem('neko_active_mode') || 'twilight';
    }

    function applyThemeMode(mode) {
      const body = document.body;
      const selector = document.getElementById('mode-selector');

      body.classList.remove('twilight-mode', 'basement-mode', 'backstage-mode');
      body.classList.add(`${mode}-mode`);

      if (selector) selector.value = mode;

      const stageTitle = document.getElementById('stage-main-title');
      const airBadge = document.getElementById('stage-air-badge');
      const drawerHeading = document.getElementById('archive-drawer-heading');

      if (mode === 'basement') {
        if (stageTitle) stageTitle.innerText = '⚡ AFTER DARK SESSIONS — BASEMENT STAGE';
        if (airBadge) airBadge.innerText = '⚡ AFTER DARK ON AIR';
        if (drawerHeading) drawerHeading.innerText = '⚡ AFTER DARK ARCHIVES';
      } else if (mode === 'backstage') {
        if (stageTitle) stageTitle.innerText = '🎟️ VIP BACKSTAGE STUDIO STAGE';
        if (airBadge) airBadge.innerText = '🎟️ VIP LIVE';
        if (drawerHeading) drawerHeading.innerText = '🎟️ VIP STEM ARCHIVES';
      } else {
        if (stageTitle) stageTitle.innerText = '🎙️ WHISPER RADIO STUDIO STAGE';
        if (airBadge) airBadge.innerText = 'ON AIR';
        if (drawerHeading) drawerHeading.innerText = '📻 Episode Archives';
      }
    }

    function loadTierEpisodes(mode) {
      stopPlayback();
      const container = document.getElementById('archive-episode-list');
      if (!container) return;

      container.innerHTML = '';
      const episodes = EPISODES_BY_MODE[mode] || EPISODES_BY_MODE.twilight;

      episodes.forEach((ep, index) => {
        const tagColor = mode === 'basement' ? '#ff4d6d' : (mode === 'backstage' ? '#ffd166' : '#a88beb');
        
        const card = document.createElement('div');
        card.id = `ep-${index}`;
        card.className = `ep-card ${index === 0 ? 'active' : ''}`;
        card.onclick = () => selectEpisode(index);
        card.innerHTML = `
          <strong>${ep.title}</strong>
          <p style="font-size: 0.8rem; margin: 4px 0 0; color: ${tagColor};">Runtime: ${ep.runtime} • ${ep.tag}</p>
        `;
        container.appendChild(card);
      });

      selectEpisode(0);
    }

    function selectEpisode(index) {
      stopPlayback();
      currentEpisodeIdx = index;
      currentLineIdx = 0;

      const currentMode = getCurrentMode();
      const episodes = EPISODES_BY_MODE[currentMode] || EPISODES_BY_MODE.twilight;

      document.querySelectorAll('.ep-card').forEach((card, idx) => {
        if (idx === index) card.classList.add('active');
        else card.classList.remove('active');
      });

      const ep = episodes[currentEpisodeIdx];
      if (ep) {
        document.getElementById('speaker-title-display').innerText = `🎙️ ${ep.title.toUpperCase()}`;
        document.getElementById('dialogue-line-display').innerText = `"Press broadcast to start listening!"`;
        document.getElementById('ep-progress-fill').style.width = '0%';
      }
    }

    function togglePodcastPlayback() {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      isPlaying = true;
      document.getElementById('podcast-play-btn').innerText = '⏸ Pause Broadcast';
      playNextLine();
    }

    function stopPlayback() {
      isPlaying = false;
      if (playbackTimer) clearTimeout(playbackTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      document.getElementById('podcast-play-btn').innerText = '▶ Start Episode Broadcast';
      document.querySelectorAll('.speaker-avatar').forEach(avatar => avatar.classList.remove('speaking'));
    }

    function playNextLine() {
      if (!isPlaying) return;

      const currentMode = getCurrentMode();
      const episodes = EPISODES_BY_MODE[currentMode] || EPISODES_BY_MODE.twilight;
      const ep = episodes[currentEpisodeIdx];

      if (!ep || currentLineIdx >= ep.script.length) {
        currentLineIdx = 0;
        stopPlayback();
        document.getElementById('dialogue-line-display').innerText = `"Episode broadcast complete! Select another episode to play."`;
        return;
      }

      const line = ep.script[currentLineIdx];

      document.querySelectorAll('.speaker-avatar').forEach(avatar => avatar.classList.remove('speaking'));
      const activeAvatar = document.getElementById(`spk-${line.speaker}`);
      if (activeAvatar) activeAvatar.classList.add('speaking');

      document.getElementById('speaker-title-display').innerText = `🎙️ ${line.title}`;
      document.getElementById('dialogue-line-display').innerText = `"${line.text}"`;

      const progressPercent = ((currentLineIdx + 1) / ep.script.length) * 100;
      document.getElementById('ep-progress-fill').style.width = `${progressPercent}%`;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(line.text);
        
        // Retrieve distinct female voice profile for the active character
        const voiceCfg = GIRL_VOICE_CONFIGS[line.speaker] || GIRL_VOICE_CONFIGS.nekomi;
        const matchedVoice = getFemaleVoice(line.speaker);
        
        if (matchedVoice) {
          utterance.voice = matchedVoice;
        }

        utterance.pitch = voiceCfg.pitch;
        utterance.rate = voiceCfg.rate;

        utterance.onend = function() {
          currentLineIdx++;
          if (isPlaying) playbackTimer = setTimeout(playNextLine, 600);
        };

        utterance.onerror = function() {
          currentLineIdx++;
          if (isPlaying) playbackTimer = setTimeout(playNextLine, 2500);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        currentLineIdx++;
        playbackTimer = setTimeout(playNextLine, 3500);
      }
    }

      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card">

          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);

      const existing = document.getElementById('neko-gate-modal');
      if (existing) existing.remove();

      userState.isLoggedIn = true;
      localStorage.setItem('neko_logged_in', 'true');
      removeExistingModals();
      handleModeChange('basement');
    }

    function simulateStripeCheckout() {
      userState.isLoggedIn = true;
      userState.isVIP = true;
      localStorage.setItem('neko_logged_in', 'true');
      localStorage.setItem('neko_is_vip', 'true');
      removeExistingModals();
      handleModeChange('backstage');
    }

    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Pre-load voices for browser Web Speech API
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      const mode = getCurrentMode();
      applyThemeMode(mode);
      loadTierEpisodes(mode);

      document.addEventListener('click', function(event) {
        const navMenu = document.getElementById('nav-menu');
        const isInsideNavbar = event.target.closest('.navbar');
        if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
        }
      });
    });
  </script>
</body>
</html>
