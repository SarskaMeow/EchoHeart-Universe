<script type="module">
  import { auth, db } from './firebase-config.js?v=3';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  window.currentUser = null;
  window.userData = {};

  // 1. Auth Listener
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      window.currentUser = user;
      try {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if (snap.exists()) {
          window.userData = snap.data();
        } else {
          window.userData = {
            displayName: user.displayName || "Lounge Member",
            email: user.email,
            photoURL: user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`,
            equippedFrame: 'none',
            equippedGlow: 'none',
            equippedTitle: 'listener'
          };
          await setDoc(userRef, window.userData, { merge: true });
        }
      } catch (e) {
        console.error("Firestore sync error:", e);
        window.userData = { displayName: user.displayName, email: user.email };
      }
      window.updatePageUI();
      window.renderProfileBadges();
    } else {
      window.location.href = "index.html";
    }
  });

  // 2. Tab Switcher (Fixed Event Handling)
  window.switchDashboardTab = function(tabName, evt) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    const targetPanel = document.getElementById(`panel-${tabName}`);
    if (targetPanel) targetPanel.classList.add('active');

    if (evt && evt.currentTarget) {
      evt.currentTarget.classList.add('active');
    } else {
      // Fallback selector
      const btns = document.querySelectorAll('.side-tabs-menu .tab-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('onclick')?.includes(`'${tabName}'`)) {
          btn.classList.add('active');
        }
      });
    }

    if (tabName === 'badges') {
      window.renderProfileBadges();
    }
  };

  // 3. Render Badges from LocalStorage
  window.renderProfileBadges = function() {
    const container = document.getElementById('account-badges-container');
    if (!container) return;

    let savedBadges = [];
    try {
      savedBadges = JSON.parse(localStorage.getItem('user_profile_badges')) || [];
    } catch (err) {
      savedBadges = [];
    }

    if (savedBadges.length === 0) {
      container.innerHTML = `
        <div class="no-badges-box">
          <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">🔍</span>
          <p style="font-size: 0.95rem; color: var(--text-light); font-weight: 700;">No Badges Unlocked Yet</p>
          <p style="font-size: 0.82rem; margin-top: 4px;">Solve weekly mystery cases on the Sakuraoka BBS and enter passcodes in the Mystery Decoder!</p>
        </div>
      `;
      return;
    }

    container.innerHTML = savedBadges.map(badge => `
      <div class="profile-badge-card">
        <div class="badge-icon-box">${badge.icon || '🏆'}</div>
        <div class="badge-info">
          <span class="badge-name">${badge.name}</span>
          <span class="badge-date">Unlocked: ${badge.unlockedAt}</span>
        </div>
      </div>
    `).join('');
  };

  window.addEventListener('storage', (event) => {
    if (event.key === 'user_profile_badges') {
      window.renderProfileBadges();
    }
  });

  // 4. Save Profile Details (Using setDoc with merge)
  window.saveProfileDetails = async function() {
    if (!window.currentUser) return;

    const nameInput = document.getElementById('edit-display-name-input');
    const bioInput = document.getElementById('edit-bio-input');
    const favSelect = document.getElementById('fav-member-select');
    const avatarInput = document.getElementById('edit-avatar-url-input');

    const newName = nameInput ? nameInput.value.trim() : '';
    const newBio = bioInput ? bioInput.value.trim() : '';
    const newFav = favSelect ? favSelect.value : 'none';
    const newAvatar = avatarInput ? avatarInput.value.trim() : '';

    if (!newName) {
      alert("Please enter a valid display name.");
      return;
    }

    try {
      const userRef = doc(db, "users", window.currentUser.uid);
      const updates = {
        displayName: newName,
        bio: newBio,
        favMember: newFav
      };

      if (newAvatar) updates.photoURL = newAvatar;

      await setDoc(userRef, updates, { merge: true });
      Object.assign(window.userData, updates);

      alert("🌸 Profile details updated successfully!");
      window.updatePageUI();
    } catch (err) {
      console.error("Failed to update profile:", err);
      alert("Error saving profile: " + err.message);
    }
  };

  // 5. Equip Cosmetic Item
  window.equipSelectedItem = async function(type, value) {
    if (!window.currentUser) return;

    const isVIP = localStorage.getItem('neko_is_vip') === 'true';
    const vipValues = ['gold_aura', 'neon_spotlight', 'gold_glow', 'cyber_sunset', 'producer', 'crew'];

    if (vipValues.includes(value) && !isVIP) {
      alert("🎟️ Backstage Pass VIP required to equip this cosmetic flair!");
      window.updatePageUI();
      return;
    }

    try {
      const userRef = doc(db, "users", window.currentUser.uid);
      const fieldMap = { frame: 'equippedFrame', glow: 'equippedGlow', title: 'equippedTitle' };
      
      if (fieldMap[type]) {
        await setDoc(userRef, { [fieldMap[type]]: value }, { merge: true });
        window.userData[fieldMap[type]] = value;
      }

      updateAvatarFramePreview(window.userData.equippedFrame);
      window.updatePageUI();
    } catch (err) {
      console.error("Failed to update equipment:", err);
    }
  };

  // 6. Live Avatar Preview Listener
  document.getElementById('edit-avatar-url-input')?.addEventListener('input', (e) => {
    const previewImg = document.getElementById('user-avatar-img');
    if (previewImg && e.target.value.trim()) {
      previewImg.src = e.target.value.trim();
    }
  });

  // Modal Helpers
  window.openPaymentModal = () => document.getElementById('payment-modal').style.display = 'flex';
  window.closePaymentModal = () => document.getElementById('payment-modal').style.display = 'none';
  window.showPaymentNotice = (gateway) => alert(`⚡ ${gateway} payments coming soon! Use Dev Override below.`);

  window.simulateVIPUnlock = async function() {
    if (!window.currentUser) return;
    const isVIP = localStorage.getItem('neko_is_vip') === 'true';
    const newStatus = !isVIP;

    try {
      const userRef = doc(db, "users", window.currentUser.uid);
      await setDoc(userRef, { isVIP: newStatus }, { merge: true });
      localStorage.setItem('neko_is_vip', newStatus ? 'true' : 'false');
      alert(newStatus ? "🎟️ Backstage Pass VIP Unlocked!" : "Reverted to Twilight Member.");
      window.closePaymentModal();
      window.updatePageUI();
    } catch (err) {
      console.error("VIP Toggle Error:", err);
    }
  };

  window.saveAppSetting = (key, val) => localStorage.setItem(`neko_setting_${key}`, val);

  window.logoutUser = function() {
    signOut(auth).then(() => {
      localStorage.removeItem('neko_logged_in');
      window.location.href = "index.html";
    });
  };

  // 7. Update UI Elements
  window.updatePageUI = function() {
    const isVIP = localStorage.getItem('neko_is_vip') === 'true';

    // Update Headers & Profile Text
    document.getElementById('user-display-name').innerText = window.userData.displayName || "Lounge Member";
    document.getElementById('user-email-text').innerText = window.userData.email || window.currentUser?.email || "";
    document.getElementById('user-avatar-img').src = window.userData.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${window.currentUser?.uid}`;

    const titleMap = {
      listener: '[Prep Room Listener]',
      otaku: '[Otaku Lounge Member]',
      rocker: '[J-Rock Specialist]',
      producer: '[Prep Room B Producer] 🎟️',
      crew: '[Phantom Crew] 🎟️'
    };
    document.getElementById('user-title-badge-text').innerText = titleMap[window.userData.equippedTitle] || '[Prep Room Listener]';

    // Populate Inputs
    document.getElementById('edit-display-name-input').value = window.userData.displayName || "";
    document.getElementById('edit-bio-input').value = window.userData.bio || "";
    document.getElementById('fav-member-select').value = window.userData.favMember || "none";
    document.getElementById('edit-avatar-url-input').value = window.userData.photoURL || "";

    // Safety & Tier Status
    document.getElementById('safety-email-display').innerText = window.userData.email || window.currentUser?.email || "";
    document.getElementById('safety-13-status').innerText = window.userData.ageVerified13 ? "✅ Verified (13+)" : "❌ Not Verified";
    document.getElementById('safety-17-status').innerText = window.userData.ageVerified17 ? "✅ Verified (17+)" : "❌ Not Verified";

    // VIP Pill & Button Updates
    const tierPill = document.getElementById('user-tier-pill');
    const tierIcon = document.getElementById('user-tier-icon');
    const tierName = document.getElementById('user-tier-name');
    const toggleVipBtn = document.getElementById('toggle-vip-btn');

    if (isVIP) {
      if (tierPill) tierPill.className = "tier-pill vip-tier";
      if (tierIcon) tierIcon.innerText = "🎟️";
      if (tierName) tierName.innerText = "Backstage Pass VIP";
      if (toggleVipBtn) toggleVipBtn.innerText = "Manage / Cancel VIP Subscription";
    } else {
      if (tierPill) tierPill.className = "tier-pill";
      if (tierIcon) tierIcon.innerText = "🌸";
      if (tierName) tierName.innerText = "Twilight Member";
      if (toggleVipBtn) toggleVipBtn.innerText = "Unlock Backstage Pass VIP";
    }

    // Wardrobe Select Values
    document.getElementById('equip-frame-select').value = window.userData.equippedFrame || 'none';
    document.getElementById('equip-glow-select').value = window.userData.equippedGlow || 'none';
    document.getElementById('equip-title-select').value = window.userData.equippedTitle || 'listener';

    // App Settings
    document.getElementById('setting-default-mode').value = localStorage.getItem('neko_setting_defaultMode') || 'twilight';
    document.getElementById('setting-autoplay').checked = localStorage.getItem('neko_setting_autoplay') === 'true';
    document.getElementById('setting-notifications').checked = localStorage.getItem('neko_setting_notifications') === 'true';
    document.getElementById('setting-join-alerts').checked = localStorage.getItem('neko_setting_joinAlerts') === 'true';

    updateAvatarFramePreview(window.userData.equippedFrame);
  };

  function updateAvatarFramePreview(frame) {
    const frameOverlay = document.getElementById('user-avatar-frame-overlay');
    if (!frameOverlay) return;

    if (frame === 'sakura_pink') {
      frameOverlay.style.border = "3px solid #f4b8c4";
      frameOverlay.style.boxShadow = "0 0 10px #f4b8c4";
    } else if (frame === 'cavern_purple') {
      frameOverlay.style.border = "3px solid #a88beb";
      frameOverlay.style.boxShadow = "0 0 12px #a88beb";
    } else if (frame === 'gold_aura') {
      frameOverlay.style.border = "3px solid #ffd166";
      frameOverlay.style.boxShadow = "0 0 14px #ffd166";
    } else if (frame === 'neon_spotlight') {
      frameOverlay.style.border = "3px solid #ff007f";
      frameOverlay.style.boxShadow = "0 0 16px #ff007f";
    } else {
      frameOverlay.style.border = "2px solid transparent";
      frameOverlay.style.boxShadow = "none";
    }
  }
</script>
