<!-- ADD TO ABOUT.HTML BELOW THE CONTACT INFORMATION SECTION -->
<h2>📩 Get in Touch / Send Feedback</h2>
<p>Have a question, feedback on 24/7 Neko FM, or a business inquiry? Fill out the form below or email us directly at <a href="mailto:support@otakuoverload.com">support@otakuoverload.com</a>.</p>

<form id="contact-form" onsubmit="handleContactSubmit(event)" style="background: rgba(8, 3, 16, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.3); max-width: 600px; margin-top: 16px;">
  <div style="margin-bottom: 14px;">
    <label style="display: block; color: var(--accent-cyan); font-weight: 800; margin-bottom: 6px;">Your Name / Username:</label>
    <input type="text" id="contact-name" required placeholder="e.g. Akari Fan" style="width: 100%; padding: 10px; background: #030108; border: 1px solid rgba(168, 139, 235, 0.4); border-radius: 8px; color: #fff; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 14px;">
    <label style="display: block; color: var(--accent-cyan); font-weight: 800; margin-bottom: 6px;">Your Email Address:</label>
    <input type="email" id="contact-email" required placeholder="name@example.com" style="width: 100%; padding: 10px; background: #030108; border: 1px solid rgba(168, 139, 235, 0.4); border-radius: 8px; color: #fff; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 14px;">
    <label style="display: block; color: var(--accent-cyan); font-weight: 800; margin-bottom: 6px;">Subject:</label>
    <select id="contact-subject" style="width: 100%; padding: 10px; background: #030108; border: 1px solid rgba(168, 139, 235, 0.4); border-radius: 8px; color: #fff; box-sizing: border-box;">
      <option value="General Support">General Support & Feedback</option>
      <option value="Music Suggestion">Girls Dead Phantom Song Suggestion</option>
      <option value="AI Studio Support">AI Studio & Orb Credits Inquiry</option>
      <option value="Advertising">Sponsorship & Business Inquiries</option>
    </select>
  </div>

  <div style="margin-bottom: 16px;">
    <label style="display: block; color: var(--accent-cyan); font-weight: 800; margin-bottom: 6px;">Message:</label>
    <textarea id="contact-message" required rows="4" placeholder="How can we help you?" style="width: 100%; padding: 10px; background: #030108; border: 1px solid rgba(168, 139, 235, 0.4); border-radius: 8px; color: #fff; box-sizing: border-box; resize: vertical;"></textarea>
  </div>

  <button type="submit" style="background: linear-gradient(135deg, var(--accent-pink), var(--accent)); color: #fff; font-weight: 900; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; width: 100%;">
    ✉️ Send Message
  </button>
</form>

<script>
  function handleContactSubmit(e) {
    e.preventDefault();
    alert("🌸 Thank you for your message! Our team at Otaku Overload & Neko FM will respond to your inquiry shortly.");
    document.getElementById('contact-form').reset();
  }
</script>
