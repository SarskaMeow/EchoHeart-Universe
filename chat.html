<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locker 102 Live Chat — Otaku Overload</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    :root {
      --nav-bg-twilight: rgba(10, 7, 20, 0.96);
      --nav-bg-basement: rgba(8, 4, 15, 0.98);
      --nav-bg-backstage: rgba(5, 2, 10, 0.99);
      --nav-border-twilight: rgba(168, 139, 235, 0.25);
      --nav-border-basement: rgba(255, 77, 109, 0.35);
      --nav-border-backstage: rgba(255, 209, 102, 0.4);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --accent-gold: #ffd166;
      --text-light: #e2daf8;
      --text-muted: #a092c0;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #070510; color: #e2daf8; }
    body.basement-mode { background: #05020a; color: #fce8ec; }
    body.backstage-mode { background: #030106; color: #ffffff; }

    body.basement-mode .navbar {
      background: var(--nav-bg-basement);
      border-bottom-color: var(--nav-border-basement);
    }

    body.backstage-mode .navbar {
      background: var(--nav-bg-backstage);
      border-bottom: 2px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(255, 209, 102, 0.2);
    }

    /* Ultra-Slim & Dark Universal Header Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--nav-bg-twilight);
      border-bottom: 1px solid var(--nav-border-twilight);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.4s ease, border-color 0.4s ease;
      box-sizing: border-box;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4px 16px 6px; /* Ultra-slim top/bottom spacing */
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Top Row Container for Mode Switcher & Title/Nav Balance */
    .nav-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Left-aligned Mode Switcher */
    .mode-selector-wrapper {
      display: flex;
      align-items: center;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 3px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .logo-link {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-main {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #cbb8f6, #f4b8c4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      filter: drop-shadow(0 2px 6px rgba(168, 139, 235, 0.3));
    }

    body.basement-mode .logo-main {
      background: linear-gradient(135deg, #ff4d6d, #cbb8f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.backstage-mode .logo-main {
      background: linear-gradient(135deg, #ffd166, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-pink);
      opacity: 0.85;
      margin-top: -1px;
    }

    body.basement-mode .logo-sub { color: var(--accent-red); }
    body.backstage-mode .logo-sub { color: var(--accent-gold); }

    .nav-links { 
      display: flex; 
      align-items: center; 
      justify-content: center;
      gap: 6px; 
      flex-wrap: wrap;
      margin-top: 2px;
    }
    
    .nav-item {
      color: #bfaee8;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
      background: rgba(14, 9, 28, 0.8);
      border: 1px solid rgba(168, 139, 235, 0.15);
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(168, 139, 235, 0.2);
      border-color: rgba(168, 139, 235, 0.4);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(168, 139, 235, 0.15);
    }

    /* Glowing Dark Mode Select Dropdown Styling */
    .mode-select-dropdown {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 5px 28px 5px 12px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f4b8c4'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
      background-color: rgba(18, 12, 36, 0.95);
      border: 1px solid rgba(168, 139, 235, 0.45);
      color: #e2daf8;
      box-shadow: 0 0 12px rgba(168, 139, 235, 0.35);
    }

    .mode-select-dropdown:hover {
      box-shadow: 0 0 16px rgba(168, 139, 235, 0.5);
      border-color: var(--accent-purple);
      color: #fff;
    }

    body.basement-mode .mode-select-dropdown {
      background-color: rgba(15, 6, 24, 0.95);
      border: 1px solid rgba(255, 77, 109, 0.6);
      color: #ff4d6d;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.4);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4d6d'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    body.backstage-mode .mode-select-dropdown {
      background-color: rgba(18, 10, 30, 0.98);
      border: 1px solid rgba(255, 209, 102, 0.7);
      color: #ffd166;
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd166'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    .mode-select-dropdown option {
      background-color: #0b0716;
      color: #e2daf8;
      padding: 8px;
      font-weight: 700;
    }

    /* Mobile Hamburger Toggle Button */
    .mobile-menu-btn {
      display: none;
      background: rgba(14, 9, 28, 0.8);
      border: 1px solid rgba(168, 139, 235, 0.2);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .hamburger-bar {
      width: 18px;
      height: 2px;
      background: var(--accent-pink);
      border-radius: 2px;
      margin: 3px 0;
    }

    @media (max-width: 992px) {
      .logo-container { position: static; transform: none; }
      .nav-top-row { justify-content: space-between; }
      .mobile-menu-btn { display: flex; flex-direction: column; }
      .nav-links {
        display: none;
        width: 100%;
        background: rgba(8, 5, 18, 0.98);
        border-top: 1px solid var(--nav-border-twilight);
        flex-direction: column;
        padding: 10px 0;
        gap: 6px;
        box-sizing: border-box;
      }
      .nav-links.open { display: flex; }
      .nav-item, .mode-selector-wrapper { width: 100%; text-align: center; box-sizing: border-box; justify-content: center; }
      .mode-select-dropdown { width: 100%; text-align: center; }
    }

    /* Chat Layout Styles */
    .chat-container {
      max-width: 1100px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 0 20px 100px;
    }

    @media (max-width: 850px) { .chat-container { grid-template-columns: 1fr; } }

    .chat-feed-box {
      background: rgba(14, 9, 28, 0.9);
      border: 2px solid rgba(168, 139, 235, 0.25);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 560px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .chat-feed-box { border-color: rgba(255, 77, 109, 0.4); }
    body.backstage-mode .chat-feed-box { border-color: rgba(255, 209, 102, 0.4); }

    .channel-tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .channel-tab-btn {
      padding: 8px 14px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      font-size: 0.8rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Name Glow Styles */
    .glow-pink_glow { text-shadow: 0 0 8px var(--accent-pink); color: var(--accent-pink) !important; }
    .glow-gold_glow { text-shadow: 0 0 8px var(--accent-gold); color: var(--accent-gold) !important; }

    .emote-bar { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .emote-btn { background: rgba(22, 15, 42, 0.8); border: 1px solid rgba(168, 139, 235, 0.25); color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
    .emote-btn:hover { background: var(--accent-purple); color: #000; }

    .post-panel {
      background: rgba(14, 9, 28, 0.9);
      border: 2px solid rgba(168, 139, 235, 0.25);
      border-radius: 16px;
      padding: 20px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .post-panel { border-color: rgba(255, 77, 109, 0.4); }
    body.backstage-mode .post-panel { border-color: rgba(255, 209, 102, 0.4); }

    .form-control {
      width: 100%;
      padding: 10px;
      background: rgba(8, 5, 16, 0.85);
      border: 1px solid rgba(168, 139, 235, 0.25);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 10px;
      box-sizing: border-box;
      outline: none;
      font-size: 0.9rem;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none;
      border-radius: 8px;
      color: #070510;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
    }

    .action-btn:hover { opacity: 0.9; }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }
  </style>
</head>
<body class="twilight-mode">

  <!-- Universal Header Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- Top Row: Mode Switcher (Left) & Centered Brand Logo -->
      <div class="nav-top-row">
        <!-- 3-Tier Access Mode Switcher on Left -->
        <div class="mode-selector-wrapper">
          <select id="mode-selector" class="mode-select-dropdown" onchange="window.switchChatChannel(this.value)">
            <option value="twilight">🌸 Twilight (Public 13+)</option>
            <option value="basement">⚡ Basement (17+) 🔒</option>
            <option value="backstage">👑 Backstage VIP Mode ✦</option>
          </select>
        </div>

        <!-- Centered Brand Logo with Lightning Bolts -->
        <div class="logo-container">
          <a href="index.html" class="logo-link">
            <span class="logo-main">⚡ OTAKU OVERLOAD ⚡</span>
            <span class="logo-sub">✦ GIRLS DEAD PHANTOM ✦</span>
          </a>
        </div>

        <!-- Mobile Hamburger Toggle Button -->
        <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation Menu" onclick="toggleMobileMenu()">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      </div>

      <!-- Main Navigation Links Below -->
      <nav class="nav-links" id="nav-menu">
        <a href="index.html" class="nav-item">🏠 Home</a>
        <a href="podcast.html" class="nav-item">🎙️ Podcast</a>
        <a href="bbs-forum.html" class="nav-item">💬 Sakuraoka BBS</a>
        <a href="neko-fm.html" class="nav-item">📻 24/7 Neko FM</a>
        <a href="chat.html" class="nav-item active">💬 Live Chat</a>
        <a href="account-profile.html" class="nav-item">👤 Profile</a>
      </nav>

    </div>
  </header>

  <!-- Live Chat Stage -->
  <main class="chat-container">
    <section class="chat-feed-box">
      
      <!-- Channel Selector Tabs -->
      <div class="channel-tabs-bar">
        <button id="tab-twilight" onclick="window.switchChatChannel('twilight')" class="channel-tab-btn" style="background: var(--accent-purple); color: #000;">
          🌸 Twilight (13+)
        </button>
        <button id="tab-basement" onclick="window.switchChatChannel('basement')" class="channel-tab-btn" style="background: rgba(255, 77, 109, 0.2); color: #ff4d6d; border: 1px solid #ff4d6d;">
          ⚡ Basement (17+) 🔒
        </button>
        <button id="tab-backstage" onclick="window.switchChatChannel('backstage')" class="channel-tab-btn" style="background: rgba(255, 209, 102, 0.2); color: #ffd166; border: 1px solid #ffd166;">
          👑 Backstage VIP ✦
        </button>
      </div>

      <!-- Real-Time Messages Display -->
      <div id="messages-display" class="chat-messages">
        <!-- Live Firestore stream loads here via chat.js -->
      </div>

      <!-- Quick Band Emote Bar -->
      <div class="emote-bar">
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🎸')">🎸 Guitar</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🎹')">🎹 Keytar</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🥁')">🥁 Drums</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🌸')">🌸 Cherry</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🍓')">🍓 Strawberry</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':neko_wave:')">:neko_wave:</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':cat_pog:')">:cat_pog:</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':orb_hype:')">:orb_hype:</button>
      </div>
    </section>

    <!-- Post Message Panel -->
    <aside class="post-panel">
      <h3>📮 Send a Message</h3>
      <p id="posting-access-note" style="font-size: 0.82rem; color: #a092c0; margin-bottom: 12px;">
        🔒 Messages are moderated by Neko-Guard 🐾 to ensure a safe community environment.
      </p>
      
      <form id="chat-form" onsubmit="window.handleSendChatMessage(event)">
        <textarea id="chat-input" class="form-control" rows="4" placeholder="Write a message to the lounge... (type /admin for dev overdrive)" required></textarea>
        <button type="submit" class="action-btn">🌸 Send Message</button>
      </form>
    </aside>
  </main>

  <!-- Universal Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="age-gate.js"></script>
  <script type="module" src="moderation.js"></script>
  <script type="module" src="chat.js"></script>

  <script>
    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('click', function(event) {
      const navMenu = document.getElementById('nav-menu');
      const isInsideNavbar = event.target.closest('.navbar');
      if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
        navMenu.classList.remove('open');
      }
    });
  </script>
  <script src="music-player.js"></script>
</body>
</html>
