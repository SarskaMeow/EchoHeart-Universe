  <style>
    :root {

      --nav-border-twilight: rgba(168, 139, 235, 0.35);
      --nav-border-basement: rgba(255, 77, 109, 0.45);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --text-light: #e2daf8;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #0d0b18; color: #e2daf8; }
    body.basement-mode { background: #08030f; color: #fce8ec; }
    body.backstage-mode { background: #05020a; color: #ffffff; }

    body.basement-mode .navbar {
      background: var(--nav-bg-basement);
      border-bottom-color: var(--nav-border-basement);

    body.backstage-mode .navbar {

    /* Universal Header Navbar */

      top: 0;

      border-bottom: 2px solid var(--nav-border-twilight);

      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.basement-mode .logo-main {
      background: linear-gradient(135deg, #ff4d6d, var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.backstage-mode .logo-sub { color: #ffd166; }

    .nav-links { display: flex; align-items: center; gap: 14px; }

      color: #cbb8f6;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;

    .nav-item:hover, .nav-item.active {

      border: 1px solid #ffd166;
      color: #ffd166;
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.35);

      background-color: #120924;
      color: #e2daf8;
      padding: 10px;
      font-weight: 700;
    }

      background-color: #0b0414;
      color: #ff4d6d;
    }

      background-color: #080210;
      color: #ffd166;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(168, 139, 235, 0.15);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 8px;
      padding: 8px;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger-bar {
      width: 22px;
      height: 2.5px;
      background: var(--accent-pink);
      border-radius: 2px;
    }

    @media (max-width: 992px) {

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 10, 30, 0.98);
        border-bottom: 2px solid var(--nav-border-twilight);
        flex-direction: column;
        padding: 16px;

      padding: 24px;

      flex-direction: column;

    .emote-btn { background: rgba(35, 25, 65, 0.8); border: 1px solid rgba(168, 139, 235, 0.3); color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; }

    .form-control {

      outline: none;
    }

    .action-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none; border-radius: 10px; color: #0d0b18; font-weight: 800; cursor: pointer;
    }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 2, 12, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: rgba(22, 15, 42, 0.96);
      border: 2px solid #a88beb;
      border-radius: 20px;
      padding: 28px;

    .modal-card h3 { margin: 0 0 10px; color: #ffffff; font-size: 1.3rem; }
    .modal-card p { color: #cbb8f6; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .modal-price-tag {

      border: 1px solid #ffd166;
      color: #ffd166;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: inline-block;

    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
    .google-btn { background: #ffffff; color: #111; }
    .stripe-btn { background: linear-gradient(135deg, #ff007f, #ffd166); color: #000; }
    .close-btn { background: transparent; color: #a88beb; border: 1px solid rgba(168, 139, 235, 0.3); }

        const data = localStorage.getItem(`neko_chat_history_${mode}`);
        return data ? JSON.parse(data) : null;
      } catch (e) {
        return null;
      }
    }

    function saveChatHistory(mode, messagesArray) {
      try {
        localStorage.setItem(`neko_chat_history_${mode}`, JSON.stringify(messagesArray));
      } catch (e) {
        console.error("Storage save error:", e);
      }
    }

    function handleModeChange(targetMode) {
      const selector = document.getElementById('mode-selector');

      if (targetMode === 'basement' && (!window.currentUser || (window.userData && !window.userData.ageVerified17))) {
        if (selector) selector.value = getCurrentMode();
        if (typeof window.handleContentAccess === "function") {
          window.handleContentAccess('basement');
        } else {
          showAuthModal('Sign-In Required', 'Sign in with Google to access After-Hours Basement streams.');
        }
        return;
      }

      localStorage.setItem('neko_active_mode', targetMode);
      applyThemeMode(targetMode);
      loadChatFeedForMode(targetMode);
    }

    function getCurrentMode() {
      return localStorage.getItem('neko_active_mode') || 'twilight';
    }

    function applyThemeMode(mode) {
      const body = document.body;
      const selector = document.getElementById('mode-selector');

      body.classList.remove('twilight-mode', 'basement-mode', 'backstage-mode');
      body.classList.add(`${mode}-mode`);

      if (selector) selector.value = mode;
    }

    function loadChatFeedForMode(mode) {
      const stream = document.getElementById('chat-stream');
      const heading = document.getElementById('chat-title-heading');
      const note = document.getElementById('posting-access-note');
      
      stream.innerHTML = '';
      if (npcStreamInterval) clearInterval(npcStreamInterval);

      if (mode === 'backstage') {
        heading.innerText = '🎟️ Locker 102 Backstage VIP Live Stream';
        note.innerHTML = '✨ <strong style="color:#ffd166;">VIP Active:</strong> Live message posting enabled for Backstage Pass members.';
      } else {
        heading.innerText = '💬 Locker 102 Live Classmate Feed';
        note.innerHTML = '🔒 Live message posting requires an active account to ensure SFW community safety.';
      }

      let history = getStoredChatHistory(mode);

      if (!history || history.length === 0) {
        history = DEFAULT_STARTER_MESSAGES[mode] || DEFAULT_STARTER_MESSAGES.twilight;
        saveChatHistory(mode, history);
      }

      history.forEach(msg => {
        appendMessageDOM(msg.author, msg.text, msg.cssClass, msg.badge);
      });

      startDynamicNPCStream();
    }

    function startDynamicNPCStream() {
      function scheduleNextNPCMessage() {
        const currentMode = getCurrentMode();
        if (currentMode !== 'backstage') {
          triggerRandomClassmateNPCMessage();
        }
        const randomDelay = Math.floor(Math.random() * 3000) + 2500;
        npcStreamInterval = setTimeout(scheduleNextNPCMessage, randomDelay);
      }

      scheduleNextNPCMessage();
    }

    function triggerRandomClassmateNPCMessage() {
      const currentMode = getCurrentMode();
      if (currentMode === 'backstage') return;

      const roll = Math.random();
      let targetType = 'common';

      if (roll < 0.82) {
        targetType = 'common';
      } else if (roll < 0.94) {
        targetType = 'rare';
      } else {
        targetType = 'ultra';
      }

      let candidateIndexes = [];
      NPC_CLASSMATE_MESSAGES.forEach((m, idx) => {
        if (m.type === targetType && !recentIndexes.includes(idx)) {
          candidateIndexes.push(idx);
        }
      });

      if (candidateIndexes.length === 0) {
        candidateIndexes = NPC_CLASSMATE_MESSAGES.map((_, idx) => idx);
      }

      const selectedIdx = candidateIndexes[Math.floor(Math.random() * candidateIndexes.length)];
      const msg = NPC_CLASSMATE_MESSAGES[selectedIdx];

      recentIndexes.push(selectedIdx);
      if (recentIndexes.length > 18) recentIndexes.shift();

      let cssClass = 'msg-card';
      let badge = '';

      if (msg.type === 'rare') {
        cssClass = 'msg-card rare-char';
        badge = '<span class="rare-badge">Band Member</span>';
      } else if (msg.type === 'ultra') {
        cssClass = 'msg-card ultra-rare';
        badge = '<span class="lore-badge">Lore Echo</span>';
      }

      addAndPersistMessage(currentMode, msg.author, msg.text, cssClass, badge);
    }

    function addAndPersistMessage(mode, author, text, cssClass = 'msg-card', badgeHTML = '') {
      let history = getStoredChatHistory(mode) || [];
      const newMsg = { author, text, cssClass, badge: badgeHTML };

      history.push(newMsg);

      if (history.length > 40) {
        history.shift();
      }

      saveChatHistory(mode, history);
      appendMessageDOM(author, text, cssClass, badgeHTML);
    }

    function appendMessageDOM(author, text, cssClass = 'msg-card', badgeHTML = '') {
      const stream = document.getElementById('chat-stream');
      if (!stream) return;

      const card = document.createElement('div');
      card.className = cssClass;
      card.innerHTML = `<div class="msg-author"><span>${author}</span> ${badgeHTML}</div><div>"${text}"</div>`;
      stream.appendChild(card);

      if (stream.children.length > 40) {
        stream.removeChild(stream.firstChild);
      }

      stream.scrollTop = stream.scrollHeight;
    }

    function handleLivePost() {
      if (!window.currentUser) {
        showAuthModal('Sign In Required', '🔒 Live message posting requires you to log in with your account!');
        return;
      }
      
      const handleInput = document.getElementById('chat-handle').value.trim();
      const handle = handleInput || (window.userData ? window.userData.displayName : 'Lounge Member');
      const text = document.getElementById('chat-text').value.trim();
      if (!text) return;

      const activeMode = getCurrentMode();
      addAndPersistMessage(activeMode, handle, text, 'msg-card vip-user', '<span class="vip-badge">Member</span>');
      document.getElementById('chat-text').value = '';
    }

    function insertEmote(emote) {
      document.getElementById('chat-text').value += ' ' + emote;
    }

    function showAuthModal(title, message) {
      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card">
            <h3>🔑 ${title}</h3>
            <p>${message}</p>
            <div class="modal-actions">
              <button class="modal-btn google-btn" onclick="if(window.loginWithGoogle) window.loginWithGoogle()">Sign In with Google</button>
              <button class="modal-btn close-btn" onclick="removeExistingModals()">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function removeExistingModals() {
      const existing = document.getElementById('neko-gate-modal');
      if (existing) existing.remove();
    }

    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const activeMode = getCurrentMode();
      applyThemeMode(activeMode);
      loadChatFeedForMode(activeMode);

      document.addEventListener('click', function(event) {
        const navMenu = document.getElementById('nav-menu');
        const isInsideNavbar = event.target.closest('.navbar');
        if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
        }
      });
    });
  </script>
  <script src="global-player.js"></script>
</body>
</html>
