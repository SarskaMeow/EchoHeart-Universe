<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locker 102 Live Chat — Otaku Overload</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    :root {
      --nav-bg-twilight: rgba(18, 12, 36, 0.94);
      --nav-bg-basement: rgba(15, 8, 22, 0.96);
      --nav-bg-backstage: rgba(14, 6, 22, 0.98);
      --nav-border-twilight: rgba(168, 139, 235, 0.35);
      --nav-border-basement: rgba(255, 77, 109, 0.45);
      --nav-border-backstage: rgba(255, 209, 102, 0.5);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --accent-gold: #ffd166;
      --text-light: #e2daf8;
      --text-muted: #a092c0;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #0d0b18; color: #e2daf8; }
    body.basement-mode { background: #08030f; color: #fce8ec; }
    body.backstage-mode { background: #05020a; color: #ffffff; }

    body.basement-mode .navbar {
      background: var(--nav-bg-basement);
      border-bottom-color: var(--nav-border-basement);
    }

    body.backstage-mode .navbar {
      background: var(--nav-bg-backstage);
      border-bottom: 2px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(255, 209, 102, 0.25);
    }

    /* Universal Header Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--nav-bg-twilight);
      border-bottom: 2px solid var(--nav-border-twilight);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.4s ease, border-color 0.4s ease;
      box-sizing: border-box;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .logo-main {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.basement-mode .logo-main {
      background: linear-gradient(135deg, #ff4d6d, var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.backstage-mode .logo-main {
      background: linear-gradient(135deg, var(--accent-gold), #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-pink);
    }

    body.basement-mode .logo-sub { color: var(--accent-red); }
    body.backstage-mode .logo-sub { color: var(--accent-gold); }

    .nav-links { display: flex; align-items: center; gap: 14px; }
    
    .nav-item {
      color: #cbb8f6;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(168, 139, 235, 0.18);
      color: #ffffff;
    }

    /* Mode Select Dropdown Styling */
    .mode-select-dropdown {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 8px 32px 8px 14px;
      border-radius: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f4b8c4'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
    }

    body.twilight-mode .mode-select-dropdown {
      background-color: rgba(28, 18, 52, 0.95);
      border: 1px solid rgba(168, 139, 235, 0.45);
      color: #e2daf8;
      box-shadow: 0 0 12px rgba(168, 139, 235, 0.2);
    }

    body.basement-mode .mode-select-dropdown {
      background-color: rgba(20, 8, 28, 0.95);
      border: 1px solid rgba(255, 77, 109, 0.5);
      color: #ff4d6d;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.25);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4d6d'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    body.backstage-mode .mode-select-dropdown {
      background-color: rgba(22, 12, 38, 0.98);
      border: 1px solid rgba(255, 209, 102, 0.6);
      color: #ffd166;
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.3);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd166'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    .mode-select-dropdown option {
      background-color: #120924;
      color: #e2daf8;
      padding: 10px;
      font-weight: 700;
    }

    /* Mobile Hamburger Toggle Button */
    .mobile-menu-btn {
      display: none;
      background: rgba(168, 139, 235, 0.15);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 8px;
      padding: 8px;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger-bar {
      width: 22px;
      height: 2.5px;
      background: var(--accent-pink);
      border-radius: 2px;
    }

    @media (max-width: 992px) {
      .mobile-menu-btn { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 10, 30, 0.98);
        border-bottom: 2px solid var(--nav-border-twilight);
        flex-direction: column;
        padding: 16px;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      }
      .nav-links.open { display: flex; }
      .nav-item, .mode-selector-wrapper { width: 100%; box-sizing: border-box; }
      .mode-select-dropdown { width: 100%; text-align: center; }
    }

    /* Chat Layout Styles */
    .chat-container {
      max-width: 1100px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 0 20px 100px;
    }

    @media (max-width: 850px) { .chat-container { grid-template-columns: 1fr; } }

    .chat-feed-box {
      background: rgba(22, 15, 42, 0.92);
      border: 2px solid rgba(168, 139, 235, 0.35);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 560px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .chat-feed-box { border-color: rgba(255, 77, 109, 0.5); }
    body.backstage-mode .chat-feed-box { border-color: rgba(255, 209, 102, 0.5); }

    .channel-tabs-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .channel-tab-btn {
      padding: 10px 16px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      font-size: 0.82rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Name Glow Styles */
    .glow-pink_glow { text-shadow: 0 0 8px var(--accent-pink); color: var(--accent-pink) !important; }
    .glow-gold_glow { text-shadow: 0 0 8px var(--accent-gold); color: var(--accent-gold) !important; }

    .emote-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .emote-btn { background: rgba(35, 25, 65, 0.8); border: 1px solid rgba(168, 139, 235, 0.3); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .emote-btn:hover { background: var(--accent-purple); color: #000; }

    .post-panel {
      background: rgba(22, 15, 42, 0.92);
      border: 2px solid rgba(168, 139, 235, 0.35);
      border-radius: 20px;
      padding: 24px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .post-panel { border-color: rgba(255, 77, 109, 0.5); }
    body.backstage-mode .post-panel { border-color: rgba(255, 209, 102, 0.5); }

    .form-control {
      width: 100%;
      padding: 12px;
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 10px;
      color: #fff;
      margin-bottom: 12px;
      box-sizing: border-box;
      outline: none;
      font-size: 0.92rem;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none;
      border-radius: 10px;
      color: #0d0b18;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    .action-btn:hover { opacity: 0.9; }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }
  </style>
</head>
<body class="twilight-mode">

  <!-- Universal Header Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- Brand Logo -->
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <span class="logo-main">🌸 OTAKU OVERLOAD</span>
          <span class="logo-sub">✦ GIRLS DEAD PHANTOM</span>
        </a>
      </div>

      <!-- Mobile Hamburger Toggle Button -->
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation Menu" onclick="toggleMobileMenu()">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>

      <!-- Main Destinations & Access Mode Selector -->
      <nav class="nav-links" id="nav-menu">
        <a href="index.html" class="nav-item">🏠 Home</a>
        <a href="podcast.html" class="nav-item">🎙️ Podcast</a>
        <a href="bbs-forum.html" class="nav-item">💬 Sakuraoka BBS</a>
        <a href="neko-fm.html" class="nav-item">📻 24/7 Neko FM</a>
        <a href="chat.html" class="nav-item active">💬 Live Chat</a>
        <a href="lore.html" class="nav-item active">📚 Lore & Books</a>
       



        <button id="nav-auth-btn" onclick="if (window.openAuthOrAccount) { window.openAuthOrAccount(); } else if (window.loginWithGoogle) { window.loginWithGoogle(); }" class="nav-item" style="background: rgba(168, 139, 235, 0.25); border: 1px solid #a88beb; cursor: pointer;">
          🔑 Login
        </button>

        <!-- 3-Tier Access Mode Switcher -->
        <div class="mode-selector-wrapper">
          <select id="mode-selector" class="mode-select-dropdown" onchange="window.switchChatChannel(this.value)">
            <option value="twilight">🌸 Twilight Channel (13+)</option>
            <option value="basement">⚡ Basement Channel (17+) 🔒</option>
            <option value="backstage">👑 Backstage VIP Mode ✦</option>
          </select>
        </div>
      </nav>

    </div>
  </header>

  <!-- Live Chat Stage -->
  <main class="chat-container">
    <section class="chat-feed-box">
      
      <!-- Channel Selector Tabs -->
      <div class="channel-tabs-bar">
        <button id="tab-twilight" onclick="window.switchChatChannel('twilight')" class="channel-tab-btn" style="background: var(--accent-purple); color: #000;">
          🌸 Twilight (13+)
        </button>
        <button id="tab-basement" onclick="window.switchChatChannel('basement')" class="channel-tab-btn" style="background: rgba(255, 77, 109, 0.2); color: #ff4d6d; border: 1px solid #ff4d6d;">
          ⚡ Basement (17+) 🔒
        </button>
        <button id="tab-backstage" onclick="window.switchChatChannel('backstage')" class="channel-tab-btn" style="background: rgba(255, 209, 102, 0.2); color: #ffd166; border: 1px solid #ffd166;">
          👑 Backstage VIP ✦
        </button>
      </div>

      <!-- Real-Time Messages Display -->
      <div id="messages-display" class="chat-messages">
        <!-- Live Firestore stream loads here via chat.js -->
      </div>

      <!-- Quick Band Emote Bar -->
      <div class="emote-bar">
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🎸')">🎸 Guitar</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🎹')">🎹 Keytar</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🥁')">🥁 Drums</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🌸')">🌸 Cherry</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode('🍓')">🍓 Strawberry</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':neko_wave:')">:neko_wave:</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':cat_pog:')">:cat_pog:</button>
        <button type="button" class="emote-btn" onclick="window.insertEmoteCode(':orb_hype:')">:orb_hype:</button>
      </div>
    </section>

    <!-- Post Message Panel -->
    <aside class="post-panel">
      <h3>📮 Send a Message</h3>
      <p id="posting-access-note" style="font-size: 0.82rem; color: #a092c0; margin-bottom: 12px;">
        🔒 Messages are moderated by Neko-Guard 🐾 to ensure a safe community environment.
      </p>
      
      <form id="chat-form" onsubmit="window.handleSendChatMessage(event)">
        <textarea id="chat-input" class="form-control" rows="4" placeholder="Write a message to the lounge... (type /admin for dev overdrive)" required></textarea>
        <button type="submit" class="action-btn">🌸 Send Message</button>
      </form>
    </aside>
  </main>

  <!-- Universal Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="age-gate.js"></script>
  <script type="module" src="moderation.js"></script>
  <script type="module" src="chat.js"></script>

  <script>
    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('click', function(event) {
      const navMenu = document.getElementById('nav-menu');
      const isInsideNavbar = event.target.closest('.navbar');
      if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
        navMenu.classList.remove('open');
      }
    });
  </script>
  <script src="music-player.js"></script>
</body>
</html>
