<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locker 102 Live Chat — EchoHeart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --nav-bg-twilight: rgba(18, 12, 36, 0.94);
      --nav-bg-basement: rgba(15, 8, 22, 0.96);
      --nav-border-twilight: rgba(168, 139, 235, 0.35);
      --nav-border-basement: rgba(255, 77, 109, 0.45);
      --accent-pink: #f4b8c4;
      --accent-purple: #a88beb;
      --accent-red: #ff4d6d;
      --text-light: #e2daf8;
    }

    body {
      background: #0d0b18;
      color: var(--text-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 3-Tier Mode Themes */
    body.twilight-mode { background: #0d0b18; color: #e2daf8; }
    body.basement-mode { background: #08030f; color: #fce8ec; }
    body.backstage-mode { background: #05020a; color: #ffffff; }

    body.basement-mode .navbar {
      background: var(--nav-bg-basement);
      border-bottom-color: var(--nav-border-basement);
    }

    body.backstage-mode .navbar {
      background: rgba(10, 4, 16, 0.98);
      border-bottom: 2px solid #ff007f;
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
    }

    /* Universal Header Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--nav-bg-twilight);
      border-bottom: 2px solid var(--nav-border-twilight);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.4s ease, border-color 0.4s ease;
      box-sizing: border-box;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .logo-main {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.basement-mode .logo-main {
      background: linear-gradient(135deg, #ff4d6d, var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.backstage-mode .logo-main {
      background: linear-gradient(135deg, #ffd166, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-pink);
    }

    body.basement-mode .logo-sub { color: var(--accent-red); }
    body.backstage-mode .logo-sub { color: #ffd166; }

    .nav-links { display: flex; align-items: center; gap: 14px; }
    
    .nav-item {
      color: #cbb8f6;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(168, 139, 235, 0.18);
      color: #ffffff;
    }

    /* Mode Select Dropdown Styling */
    .mode-select-dropdown {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 8px 32px 8px 14px;
      border-radius: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f4b8c4'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
    }

    body.twilight-mode .mode-select-dropdown {
      background-color: rgba(28, 18, 52, 0.95);
      border: 1px solid rgba(168, 139, 235, 0.45);
      color: #e2daf8;
      box-shadow: 0 0 12px rgba(168, 139, 235, 0.2);
    }

    body.basement-mode .mode-select-dropdown {
      background-color: rgba(20, 8, 28, 0.95);
      border: 1px solid rgba(255, 77, 109, 0.5);
      color: #ff4d6d;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.25);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4d6d'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    body.backstage-mode .mode-select-dropdown {
      background-color: rgba(14, 6, 22, 0.98);
      border: 1px solid #ffd166;
      color: #ffd166;
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.35);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd166'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    }

    .mode-select-dropdown option {
      background-color: #120924;
      color: #e2daf8;
      padding: 10px;
      font-weight: 700;
    }

    body.basement-mode .mode-select-dropdown option {
      background-color: #0b0414;
      color: #ff4d6d;
    }

    body.backstage-mode .mode-select-dropdown option {
      background-color: #080210;
      color: #ffd166;
    }

    /* Mobile Hamburger Toggle Button */
    .mobile-menu-btn {
      display: none;
      background: rgba(168, 139, 235, 0.15);
      border: 1px solid rgba(168, 139, 235, 0.3);
      border-radius: 8px;
      padding: 8px;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger-bar {
      width: 22px;
      height: 2.5px;
      background: var(--accent-pink);
      border-radius: 2px;
    }

    @media (max-width: 992px) {
      .mobile-menu-btn { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(15, 10, 30, 0.98);
        border-bottom: 2px solid var(--nav-border-twilight);
        flex-direction: column;
        padding: 16px;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      }
      .nav-links.open { display: flex; }
      .nav-item, .mode-selector-wrapper { width: 100%; box-sizing: border-box; }
      .mode-select-dropdown { width: 100%; text-align: center; }
    }

    /* Chat Layout Styles */
    .chat-container {
      max-width: 1100px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 0 20px;
    }

    @media (max-width: 850px) { .chat-container { grid-template-columns: 1fr; } }

    .chat-feed-box {
      background: rgba(22, 15, 42, 0.92);
      border: 2px solid rgba(168, 139, 235, 0.35);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 520px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .chat-feed-box { border-color: rgba(255, 77, 109, 0.5); }
    body.backstage-mode .chat-feed-box { border-color: #ffd166; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-card {
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(168, 139, 235, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      animation: fadeInMsg 0.35s ease forwards;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-card.vip-user {
      border-color: #ff007f;
      background: rgba(25, 10, 35, 0.85);
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.25);
    }

    .msg-card.rare-char {
      border-color: #ffd166;
      background: rgba(35, 25, 15, 0.85);
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.3);
    }

    .msg-card.ultra-rare {
      border-color: #a88beb;
      background: rgba(30, 15, 55, 0.9);
      box-shadow: 0 0 18px rgba(168, 139, 235, 0.4);
    }

    .msg-author { font-size: 0.82rem; color: #f4b8c4; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; }
    .msg-card.rare-char .msg-author { color: #ffd166; }
    .msg-card.ultra-rare .msg-author { color: #a88beb; }

    .vip-badge { background: #ff007f; color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 0.68rem; margin-left: 6px; }
    .rare-badge { background: #ffd166; color: #000; padding: 2px 6px; border-radius: 6px; font-size: 0.68rem; margin-left: 6px; font-weight: 900; }
    .lore-badge { background: #a88beb; color: #0d0b18; padding: 2px 6px; border-radius: 6px; font-size: 0.68rem; margin-left: 6px; font-weight: 900; }

    .emote-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .emote-btn { background: rgba(35, 25, 65, 0.8); border: 1px solid rgba(168, 139, 235, 0.3); color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; }

    .post-panel {
      background: rgba(22, 15, 42, 0.92);
      border: 2px solid rgba(168, 139, 235, 0.35);
      border-radius: 20px;
      padding: 24px;
      transition: border-color 0.4s ease;
    }

    body.basement-mode .post-panel { border-color: rgba(255, 77, 109, 0.5); }
    body.backstage-mode .post-panel { border-color: #ffd166; }

    .form-control {
      width: 100%; padding: 10px; background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(168, 139, 235, 0.3); border-radius: 8px; color: #fff; margin-bottom: 12px; box-sizing: border-box;
      outline: none;
    }

    .action-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #a88beb, #f4b8c4);
      border: none; border-radius: 10px; color: #0d0b18; font-weight: 800; cursor: pointer;
    }

    body.basement-mode .action-btn { background: linear-gradient(135deg, #ff4d6d, #a88beb); color: #ffffff; }
    body.backstage-mode .action-btn { background: linear-gradient(135deg, #ffd166, #ff007f); color: #000000; }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 2, 12, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: rgba(22, 15, 42, 0.96);
      border: 2px solid #a88beb;
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .vip-modal-card { border-color: #ff007f; box-shadow: 0 0 30px rgba(255, 0, 127, 0.4); }
    .modal-card h3 { margin: 0 0 10px; color: #ffffff; font-size: 1.3rem; }
    .modal-card p { color: #cbb8f6; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .modal-price-tag {
      background: rgba(255, 209, 102, 0.15);
      border: 1px solid #ffd166;
      color: #ffd166;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: inline-block;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
    .google-btn { background: #ffffff; color: #111; }
    .stripe-btn { background: linear-gradient(135deg, #ff007f, #ffd166); color: #000; }
    .close-btn { background: transparent; color: #a88beb; border: 1px solid rgba(168, 139, 235, 0.3); }
  </style>
</head>
<body class="twilight-mode">

  <!-- Universal Header Navigation -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- Brand Logo -->
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <span class="logo-main">🌸 OTAKU NEKO LOUNGE</span>
          <span class="logo-sub">✦ ECHOHEART UNIVERSE</span>
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation Menu" onclick="toggleMobileMenu()">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>

      <!-- Navigation Links & 3-Tier Mode Selector -->
      <nav class="nav-links" id="nav-menu">
        <a href="index.html" class="nav-item">🏠 Home</a>
        <a href="podcast.html" class="nav-item">🎙️ Podcast</a>
        <a href="neko-fm.html" class="nav-item">📻 24/7 Neko FM</a>
        <a href="chat.html" class="nav-item active">💬 Live Chat</a>
        <a href="hub.html" class="nav-item">🌌 Universe Hub</a>

        <!-- 3-Tier Access Mode Switcher -->
        <div class="mode-selector-wrapper">
          <select id="mode-selector" class="mode-select-dropdown" onchange="handleModeChange(this.value)">
            <option value="twilight">🌸 Twilight (Public)</option>
            <option value="basement">⚡ Basement 🔒</option>
            <option value="backstage">🎟️ Backstage Pass 💎</option>
          </select>
        </div>
      </nav>

    </div>
  </header>

  <!-- Live Chat Stage -->
  <main class="chat-container">
    <section class="chat-feed-box">
      <h3 id="chat-title-heading">💬 Locker 102 Live Classmate Feed</h3>
      <div id="chat-stream" class="chat-messages">
        <!-- Live Chat & NPC Message Feed Populates Here -->
      </div>

      <!-- Band Emote Selector -->
      <div class="emote-bar">
        <button class="emote-btn" onclick="insertEmote('🎸')">🎸 Guitar</button>
        <button class="emote-btn" onclick="insertEmote('🎹')">🎹 Keytar</button>
        <button class="emote-btn" onclick="insertEmote('🥁')">🥁 Drums</button>
        <button class="emote-btn" onclick="insertEmote('🌸')">🌸 Cherry</button>
      </div>
    </section>

    <!-- Post Note Drawer -->
    <aside class="post-panel">
      <h3>📮 Send a Note</h3>
      <p id="posting-access-note" style="font-size: 0.82rem; color: #a88beb;">🔒 Live message posting requires an active Backstage Pass to ensure SFW community safety.</p>
      
      <input type="text" id="chat-handle" class="form-control" placeholder="Your Student Name">
      <textarea id="chat-text" class="form-control" rows="4" placeholder="Write a message to the band..."></textarea>
      
      <button class="action-btn" onclick="handleLivePost()">🌸 Post to Locker 102</button>
    </aside>
  </main>

  <script>
    // User Auth & Tier State
    let userState = {
      isLoggedIn: localStorage.getItem('neko_logged_in') === 'true',
      isVIP: localStorage.getItem('neko_is_vip') === 'true'
    };

    // Classmate NPC Chat Pools (Rarity-weighted)
    const NPC_CLASSMATE_MESSAGES = [
      { type: 'common', author: 'Locker_88', text: 'Did anyone leave drumsticks near Prep Room B? 🥁' },
      { type: 'common', author: 'Class_2B_Student', text: 'That keytar synth solo in the rehearsal feed was insane! 🎹⚡' },
      { type: 'common', author: 'Sakuraoka_Guitarist', text: 'Who voted on the Neko FM setlist poll today?' },
      { type: 'common', author: 'PrepRoom_Lurker', text: 'Are they practicing down in the subterranean basement after school?' },
      { type: 'common', author: 'Subterranean_Vibes', text: 'The reverb on that acoustic track is so soothing 🌸' },
      { type: 'common', author: 'Locker_102_Regular', text: 'Got my headphones on! Ready for tonight’s broadcast stream.' },
      { type: 'common', author: 'Class_1A_Listener', text: 'Has anyone seen the new light novel lore entry in Universe Hub?' },
      { type: 'common', author: 'BassLine_Fan', text: 'Tempo shifts in Episode 2 were wild!! 🎸' },

      // Rare Character Pop-ins
      { type: 'rare', author: 'Akari Minase', text: 'Thanks for tuning in everyone! We are working on new guitar arrangements right now 🎸' },
      { type: 'rare', author: 'Nekomi', text: 'Don’t forget to cast your vote on the weekly Neko FM setlist poll! 🌸' },
      { type: 'rare', author: 'Sera', text: 'Keytar synth lead calibration complete. Prep Room B sound check ready! 🎹' },
      { type: 'rare', author: 'Aoi', text: 'Drums tuned! Let’s turn up the volume for the broadcast feed 🥁' },

      // Ultra-Rare Cavern Lore Pop-ins
      { type: 'ultra', author: 'Cavern_Echo_Voice', text: '✦ Resonance frequency detected beneath Sakuraoka High... ⚡' },
      { type: 'ultra', author: 'Phantom_Stagehand', text: 'Who left the amplifier dials on 11 in the cavern hall? 👻' }
    ];

    const VIP_FEED_PRESETS = [
      { author: 'Student_Akari_Fan', vip: true, text: 'The drum tempo shift in Episode 2 was insane! 🥁⚡' },
      { author: 'Sera_Keytar_Listener', vip: true, text: 'Hoping we get an acoustic version of the cavern track next week!' },
      { author: 'VIP_Backstage_Pass', vip: true, text: 'Master stem downloads in the Hub are sounding crisp today 💎' }
    ];

    let npcStreamInterval = null;

    function handleModeChange(targetMode) {
      const selector = document.getElementById('mode-selector');

      if (targetMode === 'basement' && !userState.isLoggedIn) {
        if (selector) selector.value = getCurrentMode();
        showAuthModal('Google Login Required', 'Sign in with Google to access After-Hours Basement streams and community profiles.');
        return;
      }

      if (targetMode === 'backstage' && !userState.isVIP) {
        if (selector) selector.value = getCurrentMode();
        showVIPModal('Backstage Pass Required', 'Unlock live message posting in Locker 102, exclusive subterranean audio, and stem mixers.');
        return;
      }

      localStorage.setItem('neko_active_mode', targetMode);
      applyThemeMode(targetMode);
      loadChatFeedForMode(targetMode);
    }

    function getCurrentMode() {
      return localStorage.getItem('neko_active_mode') || 'twilight';
    }

    function applyThemeMode(mode) {
      const body = document.body;
      const selector = document.getElementById('mode-selector');

      body.classList.remove('twilight-mode', 'basement-mode', 'backstage-mode');
      body.classList.add(`${mode}-mode`);

      if (selector) selector.value = mode;
    }

    function loadChatFeedForMode(mode) {
      const stream = document.getElementById('chat-stream');
      const heading = document.getElementById('chat-title-heading');
      const note = document.getElementById('posting-access-note');
      
      stream.innerHTML = '';
      if (npcStreamInterval) clearInterval(npcStreamInterval);

      if (mode === 'backstage') {
        heading.innerText = '🎟️ Locker 102 Backstage VIP Live Stream';
        note.innerHTML = '✨ <strong style="color:#ffd166;">VIP Active:</strong> Live message posting enabled for Backstage Pass members.';
        
        // Populate initial VIP feed
        VIP_FEED_PRESETS.forEach(msg => {
          appendMessageToFeed(msg.author, msg.text, 'vip-user', '<span class="vip-badge">VIP Pass</span>');
        });
      } else {
        heading.innerText = '💬 Locker 102 Live Classmate Feed';
        note.innerHTML = '🔒 Live message posting requires an active Backstage Pass to ensure SFW community safety.';

        // Populate initial classmate starter messages
        appendMessageToFeed('Locker_42', 'Anyone down at Prep Room B today?', 'msg-card');
        appendMessageToFeed('Class_2B_Student', 'The keytar riff is stuck in my head all afternoon 🎹', 'msg-card');

        // Start Auto-NPC Chat Feed
        npcStreamInterval = setInterval(triggerRandomClassmateNPCMessage, 4500);
      }
    }

    function triggerRandomClassmateNPCMessage() {
      if (getCurrentMode() === 'backstage') return;

      const roll = Math.random();
      let candidates = [];

      if (roll < 0.70) {
        // 70% Common Locker classmates
        candidates = NPC_CLASSMATE_MESSAGES.filter(m => m.type === 'common');
      } else if (roll < 0.92) {
        // 22% Rare Character Pop-in
        candidates = NPC_CLASSMATE_MESSAGES.filter(m => m.type === 'rare');
      } else {
        // 8% Ultra-Rare Cavern Pop-in
        candidates = NPC_CLASSMATE_MESSAGES.filter(m => m.type === 'ultra');
      }

      const msg = candidates[Math.floor(Math.random() * candidates.length)];
      let cssClass = 'msg-card';
      let badge = '';

      if (msg.type === 'rare') {
        cssClass = 'msg-card rare-char';
        badge = '<span class="rare-badge">Band Member</span>';
      } else if (msg.type === 'ultra') {
        cssClass = 'msg-card ultra-rare';
        badge = '<span class="lore-badge">Lore Echo</span>';
      }

      appendMessageToFeed(msg.author, msg.text, cssClass, badge);
    }

    function appendMessageToFeed(author, text, cssClass = 'msg-card', badgeHTML = '') {
      const stream = document.getElementById('chat-stream');
      const card = document.createElement('div');
      card.className = cssClass;
      card.innerHTML = `<div class="msg-author"><span>${author}</span> ${badgeHTML}</div><div>"${text}"</div>`;
      stream.appendChild(card);

      // Keep maximum 35 messages to maintain smooth performance
      if (stream.children.length > 35) {
        stream.removeChild(stream.firstChild);
      }

      stream.scrollTop = stream.scrollHeight;
    }

    function handleLivePost() {
      if (!userState.isVIP) {
        showVIPModal('Backstage Pass Required', '🔒 Locker 102 Live Message Posting is reserved for Backstage Pass holders to ensure a safe, troll-free community!');
        return;
      }
      
      const handle = document.getElementById('chat-handle').value.trim() || 'Anonymous Student';
      const text = document.getElementById('chat-text').value.trim();
      if (!text) return;

      appendMessageToFeed(handle, text, 'msg-card vip-user', '<span class="vip-badge">VIP Pass</span>');
      document.getElementById('chat-text').value = '';
    }

    function insertEmote(emote) {
      document.getElementById('chat-text').value += ' ' + emote;
    }

    function showAuthModal(title, message) {
      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card">
            <h3>🔑 ${title}</h3>
            <p>${message}</p>
            <div class="modal-actions">
              <button class="modal-btn google-btn" onclick="simulateGoogleLogin()">Sign In with Google</button>
              <button class="modal-btn close-btn" onclick="removeExistingModals()">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function showVIPModal(title, message) {
      removeExistingModals();
      const modalHTML = `
        <div id="neko-gate-modal" class="modal-overlay">
          <div class="modal-card vip-modal-card">
            <h3>🎟️ ${title}</h3>
            <p>${message}</p>
            <div class="modal-price-tag">$4.99 / month • Backstage Pass</div>
            <div class="modal-actions">
              <button class="modal-btn stripe-btn" onclick="simulateStripeCheckout()">Unlock Backstage Pass</button>
              <button class="modal-btn close-btn" onclick="removeExistingModals()">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function removeExistingModals() {
      const existing = document.getElementById('neko-gate-modal');
      if (existing) existing.remove();
    }

    function simulateGoogleLogin() {
      userState.isLoggedIn = true;
      localStorage.setItem('neko_logged_in', 'true');
      removeExistingModals();
      handleModeChange('basement');
    }

    function simulateStripeCheckout() {
      userState.isLoggedIn = true;
      userState.isVIP = true;
      localStorage.setItem('neko_logged_in', 'true');
      localStorage.setItem('neko_is_vip', 'true');
      removeExistingModals();
      handleModeChange('backstage');
    }

    function toggleMobileMenu() {
      const navMenu = document.getElementById('nav-menu');
      if (navMenu) navMenu.classList.toggle('open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const activeMode = getCurrentMode();
      applyThemeMode(activeMode);
      loadChatFeedForMode(activeMode);

      document.addEventListener('click', function(event) {
        const navMenu = document.getElementById('nav-menu');
        const isInsideNavbar = event.target.closest('.navbar');
        if (!isInsideNavbar && navMenu && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
        }
      });
    });
  </script>
</body>
</html>
