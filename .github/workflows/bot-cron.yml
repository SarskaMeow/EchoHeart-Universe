name: Bot Chat Generator Cron

on:
  schedule:
    # Overlapping 10-minute triggers ensure maximum execution priority on GitHub Actions
    - cron: '*/10 * * * *'
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch: # Allows manual trigger testing from Actions tab

jobs:
  run-bot-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Execute Bot Generator Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/bot-tick.js
