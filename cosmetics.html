<script>
    /* INTERACTIVE HUD CYCLING LOGIC FOR LANDING PAGE */
    const gateStates = [
      { text: "[Sub-Stage Gate: Online]", mode: "" },
      { text: "[Sub-Stage Gate: Overclocked]", mode: "warn" },
      { text: "[Sub-Stage Gate: Critical Strain!]", mode: "alert" }
    ];

    const nodeStates = [
      { text: "[Node Frequency: 108.0 MHz]", mode: "" },
      { text: "[Node Frequency: Boosted]", mode: "warn" },
      { text: "[Node Frequency: Resonant Surge]", mode: "alert" }
    ];

    const dissonanceStates = [
      { text: "[Dissonance Static: Low]", mode: "" },
      { text: "[Dissonance Static: Spiking]", mode: "warn" },
      { text: "[Dissonance Static: BREACH!]", mode: "alert" }
    ];

    const syncStates = [
      { text: "[Heart Sync Circuit: Building]", mode: "" },
      { text: "[Heart Sync Circuit: Resonant]", mode: "" },
      { text: "[Heart Sync Circuit: 100% OVERDRIVE]", mode: "alert" }
    ];

    let idxGate = 0;
    let idxNode = 0;
    let idxDissonance = 0;
    let idxSync = 1;

    function updateHudBtn(btnId, textId, stateArr, currentIdx) {
      const btn = document.getElementById(btnId);
      const textSpan = document.getElementById(textId);
      const state = stateArr[currentIdx];

      textSpan.textContent = state.text;
      btn.classList.remove('warn', 'alert');
      if (state.mode) {
        btn.classList.add(state.mode);
      }
    }

    function cycleGateStatus() {
      idxGate = (idxGate + 1) % gateStates.length;
      updateHudBtn('btn-gate', 'text-gate', gateStates, idxGate);
    }

    function cycleNodeStatus() {
      idxNode = (idxNode + 1) % nodeStates.length;
      updateHudBtn('btn-node', 'text-node', nodeStates, idxNode);
    }

    function cycleDissonanceLayer() {
      idxDissonance = (idxDissonance + 1) % dissonanceStates.length;
      updateHudBtn('btn-dissonance', 'text-dissonance', dissonanceStates, idxDissonance);
    }

    function cycleSyncStatus() {
      idxSync = (idxSync + 1) % syncStates.length;
      updateHudBtn('btn-sync', 'text-sync', syncStates, idxSync);
    }

      const modalHTML = `

            <div class="store-header-row">

            </div>

            <div class="store-tabs-nav">
              <button class="store-tab-btn ${category === 'colors' ? 'active' : ''}" onclick="renderStoreTab('colors')">🎨 Name Colors</button>
              <button class="store-tab-btn ${category === 'frames' ? 'active' : ''}" onclick="renderStoreTab('frames')">🖼️ Avatar Borders</button>

            <div class="store-item-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
              ${itemsHTML}

            <div style="margin-top: 24px; text-align: right;">
              <button class="close-btn" onclick="removeExistingModals()">Close Store</button>
            </div>

          </div>

      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function removeExistingModals() {
      const existing = document.getElementById('neko-gate-modal');
      if (existing) existing.remove();
    }
  </script>
